<!DOCTYPE html>

<style>
:root{
  /* Layout: one screen, a glass jar of European flag balls; HUD in bands on phones, side panels on wide screens */
  --night:#0a1c47;
  --dusk:#123072;
  --paper:#fbf6ea;
  --ink:#0f2350;
  --berry:#e8b400;
  --gold:#ffcc00;
  --lilac:#a9c1f0;
  --display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --body:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.iconbtn{position:fixed;z-index:5;width:40px;height:40px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--paper);cursor:pointer;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.iconbtn svg{width:20px;height:20px;display:block}
.iconbtn[hidden]{display:none}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(14,12,38,.5)}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none;z-index:-1}
#overlay[hidden]{display:none}
.abil{position:fixed;z-index:5;height:34px;padding:0 12px;border:2px solid #ffd84d;border-radius:12px;font:800 13px/1 var(--body);color:#fff;cursor:pointer;letter-spacing:.02em;
  background:linear-gradient(90deg,#e8a800 0,#ffcc00 var(--p,0%),rgba(10,28,71,.85) var(--p,0%),rgba(10,28,71,.85) 100%);
  box-shadow:0 0 0 2px #0a1c47,0 0 14px rgba(255,204,0,.35),inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #6b5000;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;font-variant-numeric:tabular-nums}
.abil.ready{color:var(--ink);text-shadow:none;box-shadow:0 0 0 2px #0a1c47,0 0 22px rgba(255,204,0,.8),inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 #6b5000}
.abil[hidden]{display:none}
.abil.ready{animation:abilpulse 1s ease-in-out infinite}
.abil:disabled{cursor:default;color:rgba(255,255,255,.85)}
.abil:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
@keyframes abilpulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){.abil.ready{animation:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:15;pointer-events:none}
.card{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:28px;padding:24px 24px 22px;text-align:center;box-shadow:0 26px 70px rgba(4,2,24,.55)}
.title{font-family:var(--display);font-weight:400;font-size:min(52px,11.5vw);line-height:1.05;margin:0 0 6px;letter-spacing:1px;white-space:nowrap}
.title span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.lead{font-size:18px;line-height:1.35;font-weight:600;margin:2px auto 16px;max-width:30ch;text-wrap:balance}
.rules{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px;text-align:left;font-size:16px;line-height:1.3;font-weight:500}
.rules li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;margin-top:1px;box-shadow:inset -3px -4px 0 rgba(35,29,69,.18),inset 3px 3px 0 rgba(255,255,255,.45)}
.btn{font:800 22px/1 var(--body);border:0;border-radius:999px;padding:14px 40px 11px;background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #b58f00;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b58f00}
.btn:focus-visible{outline:3px solid #6f63ff;outline-offset:4px}
.btn.alt{background:#e3eafa;color:var(--ink);box-shadow:0 5px 0 #b9c7e8;font-size:18px;padding:12px 26px 9px}
.btn.alt:active{box-shadow:0 1px 0 #b9c7e8}
.saves{margin:18px 0 0;text-align:left}
.saves h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5d6b8c;margin:0 0 8px;font-weight:700}
.saves ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.saves li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(15,35,80,.06);border-radius:14px;padding:8px 10px 8px 12px;font-size:14px}
.slotname{font-weight:700}
.slotinfo{grid-column:1;font-size:13px;color:#4c5a7c}
.slotbtns{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px}
.muted{opacity:.6}
.mini{font:700 14px/1 var(--body);border:0;border-radius:999px;padding:9px 13px 7px;background:var(--ink);color:#fff;cursor:pointer}
.mini.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(15,35,80,.3)}
.mini:focus-visible{outline:3px solid #6f8dff;outline-offset:2px}
.note{font-size:14px;font-weight:600;color:#1f7a3a;margin:0 0 10px}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.keys{font-size:13px;color:#6c6590;margin:16px 0 0;font-weight:500}
.mascot{display:block;width:96px;height:96px;margin:-8px auto -4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.audio{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;text-align:left;font-size:14px;font-weight:700;background:rgba(15,35,80,.06);border-radius:14px;padding:10px 12px}
.audio select{font:600 15px var(--body);color:var(--ink);background:#fff;border:1.5px solid rgba(15,35,80,.25);border-radius:10px;padding:6px 8px;min-width:0}
.audio input[type=range]{width:100%;accent-color:#e8b400}
.audio select:focus-visible,.audio input:focus-visible{outline:3px solid #6f8dff;outline-offset:2px}
.menu-btns{display:grid;gap:10px;margin-top:4px}
.menu-btns .btn{width:100%}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(15,35,80,.06);border-radius:14px;padding:10px 12px}
.list b{font-size:16px}
.list small{grid-column:1;font-size:13px;color:#4c5a7c;line-height:1.3}
.list .mini{grid-column:2;grid-row:1 / span 2}
.list li.locked{opacity:.5}
.list li.done{background:rgba(232,180,0,.16)}
.ach{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;text-align:left;max-height:46vh;overflow:auto}
.ach li{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:center;padding:7px 10px;border-radius:12px;background:rgba(15,35,80,.05)}
.ach li.got{background:rgba(232,180,0,.18)}
.ach .ico{grid-row:1 / span 2;width:34px;height:34px}
.ach li{grid-template-columns:36px 1fr}
.ach b{font-size:15px}
.ach small{font-size:12.5px;color:#4c5a7c}
.ach h4{grid-column:1 / -1;margin:8px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5d6b8c;background:none}
.trophies{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.trophies svg{width:34px;height:34px}
.trophies .off{opacity:.18;filter:grayscale(1)}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:30;display:flex;gap:10px;align-items:center;
  background:linear-gradient(180deg,#fff6d1,#ffe07a);color:var(--ink);border:2px solid #c99a00;border-radius:16px;padding:9px 16px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  font:700 14px/1.25 var(--body);transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:calc(100vw - 24px);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#toast svg{width:30px;height:30px;flex:none}
#toast small{display:block;font-weight:600;color:#5b4a00}
.mascot.big{width:130px;height:130px;margin:-4px auto 0;position:sticky;top:-10px;z-index:2;background:radial-gradient(circle,var(--paper) 60%,transparent 72%)}
.wtitle{margin:12px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5d6b8c;text-align:left}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.witem{font:inherit;text-align:left;border:1.5px solid rgba(15,35,80,.18);background:#fff;border-radius:12px;padding:7px 9px;cursor:pointer;color:var(--ink);display:grid;gap:1px}
.witem b{font-size:14px}
.witem small{font-size:11.5px;color:#5d6b8c;line-height:1.2}
.witem.on{border-color:#e8b400;background:#fff6d1;box-shadow:0 0 0 2px #ffcc00 inset}
.witem.locked{opacity:.45;cursor:default}
.witem:focus-visible{outline:3px solid #6f8dff;outline-offset:2px}
.install{margin-top:16px}
.install:empty{display:none}
.hint{font-size:14px;line-height:1.35;color:#6c6590;margin:0;font-weight:500}
.h2{font-family:var(--display);font-weight:400;font-size:min(46px,11vw);line-height:1.05;margin:0 0 6px;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-wrap:balance}
.final{font-size:68px;font-weight:800;line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.sub{margin:6px 0 14px;font-size:17px;font-weight:600;color:#6c6590}
.sub.win{color:#c58f00}
.biggest{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 22px;font-size:16px;font-weight:600}
@media (hover: none) and (pointer: coarse){.keys{display:none}}
@media (prefers-reduced-motion: reduce){.btn,.iconbtn{transition:none}}

/* Start screen: dark, high-contrast card with icon tiles */
.card.start{background:radial-gradient(120% 80% at 50% 0%,#1c3c8c 0,#0d2160 45%,#060f2e 100%);color:#fff;border:2px solid rgba(255,204,0,.6);
  box-shadow:0 0 0 4px rgba(6,15,46,.7),0 0 40px rgba(255,204,0,.25),0 26px 70px rgba(0,0,0,.6)}
.start .title span{-webkit-text-stroke:3px #050c26;filter:drop-shadow(0 3px 0 #050c26) drop-shadow(0 0 10px rgba(255,255,255,.25))}
.start .lead{color:#dce6ff;font-size:16px;margin-bottom:12px}
.start .mascot{background:radial-gradient(circle,rgba(255,204,0,.28) 0,rgba(255,204,0,0) 62%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:7px 4px 6px;display:grid;justify-items:center;gap:1px}
.stat svg{width:20px;height:20px}
.stat b{font:800 17px/1.1 var(--body);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a9bbe8;font-weight:700}
.mb{display:grid;grid-template-columns:40px 1fr 16px;align-items:center;gap:12px;width:100%;text-align:left;font:700 17px/1.15 var(--body);color:#fff;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:8px 12px 8px 8px;transition:background .12s,transform .08s,border-color .12s}
.mb:hover{background:rgba(255,255,255,.14);border-color:rgba(255,204,0,.55)}
.mb:active{transform:scale(.98)}
.mb:focus-visible{outline:3px solid #ffcc00;outline-offset:2px}
.mb small{display:block;font-size:12.5px;font-weight:600;color:#a9bbe8;margin-top:1px}
.mb .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.mb .ic svg{width:22px;height:22px}
.mb .chev{width:16px;height:16px;opacity:.6}
.mb.primary{background:linear-gradient(180deg,#ffd84d,#ffb800);color:#0a1c47;border:0;box-shadow:0 5px 0 #a57a00,0 0 24px rgba(255,204,0,.4);font-size:21px;padding:10px 14px 10px 10px}
.mb.primary small{color:#5b4300}
.mb.primary .ic{background:#0a1c47;color:#ffcc00}
.mb.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a57a00}
.mb.primary:hover{border:0;filter:brightness(1.05)}
.start .menu-btns{gap:8px}
.start .menu-btns .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start .menu-btns .two .mb{grid-template-columns:36px 1fr;font-size:15px;gap:9px}
.start .menu-btns .two .mb .ic{width:36px;height:36px}
.start .menu-btns .two .chev{display:none}
.start .saves h3,.start .wtitle{color:#a9bbe8}
.start .saves li,.start .audio{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.start .slotinfo{color:#b9c8ee}
.start .mini{background:#ffcc00;color:#0a1c47}
.start .mini.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.start .audio select{background:#0a1c47;color:#fff;border-color:rgba(255,255,255,.3)}
.start .keys,.start .hint{color:#a9bbe8}
.start .btn.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}

.start .h2{color:#ffcc00;-webkit-text-stroke:2px #050c26;filter:drop-shadow(0 3px 0 #050c26)}
.start .sub{color:#b9c8ee}.start .sub.win{color:#ffd84d}
.start .final,.start .biggest{color:#fff}
.start .rules li{color:#e6ecff}
.start .list li,.start .ach li{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.start .list small,.start .ach small{color:#a9bbe8}
.start .list li.done,.start .ach li.got{background:rgba(255,204,0,.15);border-color:rgba(255,204,0,.45)}
.start .ach h4{color:#a9bbe8;border:0}
.start .witem{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#fff}
.start .witem small{color:#a9bbe8}
.start .witem.on{background:rgba(255,204,0,.2);border-color:#ffcc00}
.start .mascot.big{background:radial-gradient(circle,#15306f 60%,transparent 72%)}
.start .note{color:#7fe0a0}
.start .btn:focus-visible{outline-color:#ffcc00}
.mbs{display:grid;gap:8px;margin:6px 0 4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tcard{font:inherit;text-align:left;display:grid;gap:3px;padding:8px;border-radius:16px;cursor:pointer;color:#fff;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)}
.tcard b{font-size:15px}.tcard small{font-size:12px;color:#a9bbe8;line-height:1.25}
.tcard.on{border-color:#ffcc00;background:rgba(255,204,0,.16);box-shadow:0 0 0 2px #ffcc00 inset}
.tcard.locked{opacity:.5;cursor:default}
.tcard:focus-visible{outline:3px solid #ffcc00;outline-offset:2px}
.tsw{height:58px;border-radius:11px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tsw svg{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
</style>

<body>
<div id="safe" aria-hidden="true"></div>
<canvas id="game" aria-label="Pelialue: purkki täynnä lippupalloja"></canvas>
<button class="iconbtn" id="soundBtn" type="button" aria-label="Mykistä äänet"></button>
<button class="iconbtn" id="pauseBtn" type="button" aria-label="Tauko" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="abil" id="abilBtn" type="button" hidden>Heilauta</button>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay"><div class="card" id="card" role="dialog" aria-modal="true" aria-label="PiispanPELI"></div></div>
<script>
'use strict';
(function () {
// <engine>
// ---- Soft-body engine: every blob is a ring of small beads held together by
// ---- skin (edge length), pressure (area) and a soft shape-matching spring.
const WORLD_W = 12, FLOOR_Y = 19.2, DANGER_Y = 2.75, LX = 6, LY = 1.1;
const GRAV = 24, RB = 0.11, SPACING = 0.165;
const RADII = [0.40, 0.47, 0.54, 0.63, 0.74, 0.86, 1.00, 1.17, 1.36, 1.59, 1.85, 2.16, 2.51, 2.93, 3.40];
const MAXL = RADII.length - 1;
const STEP = 1 / 60, SUB = 8, H = STEP / SUB;
const KE = 0.9, KA = 0.25, KS = 0.003, SLACK = 0.9;
const INT_DAMP = 0.997, GLOB_DAMP = 0.99995, VMAX = 60;
const ANG_KEEP = 0.9995, REST_V = 0.02, REST_DAMP = 0.995, MASS_EXP = -0.5;
const MU = 0.03, WALL_MU = 0.1, FLOOR_MU = 0.1, GROW_T = 0.32;
const MAXN = 9000;
const X = new Float64Array(MAXN), Y = new Float64Array(MAXN);
const PX = new Float64Array(MAXN), PY = new Float64Array(MAXN);
const VX = new Float64Array(MAXN), VY = new Float64Array(MAXN);
const IW = new Float64Array(MAXN), OWN = new Int32Array(MAXN);
const TGX = new Float64Array(512), TGY = new Float64Array(512);
const CELL = 0.25, GX0 = -1.5, GY0 = -12;
const GW = Math.ceil((WORLD_W + 3) / CELL), GH = Math.ceil((FLOOR_Y + 14) / CELL), GN = GW * GH;
const cellStart = new Int32Array(GN + 1), cellCur = new Int32Array(GN);
const cellItems = new Int32Array(MAXN), beadCell = new Int32Array(MAXN);
const CD = 2 * RB, CD2 = CD * CD;
const E = { blobs: [], NB: 0, mergeQ: [], events: [], idc: 0, gx: 0, gy: GRAV };

function easeOutBack(u) { const c1 = 2.2, c3 = c1 + 1, t = u - 1; return 1 + c3 * t * t * t + c1 * t * t; }

function makeBlob(level, cx, cy, vx, vy, s0) {
  const R = RADII[level], Rr = R - RB;
  const n = Math.max(10, Math.round(2 * Math.PI * Rr / SPACING));
  if (E.NB + n > MAXN) return null;
  const sc = s0 == null ? 1 : s0;
  const b = {
    id: ++E.idc, level, R, Rr, n, start: E.NB, index: E.blobs.length,
    rest: 2 * Rr * Math.sin(Math.PI / n), area0: 0.5 * n * Rr * Rr * Math.sin(2 * Math.PI / n),
    rx: new Float64Array(n), ry: new Float64Array(n),
    // big balls keep their shape better so they don't droop
    slack: SLACK + (1 - SLACK) * 0.8 * level / MAXL, ks: KS * (1 + 2.5 * level / MAXL),
    s0: sc, scale: sc, gt: sc < 1 ? 0 : GROW_T, age: 0, alive: true, merging: false, touched: false,
    cx, cy, vx, vy, ang: 0, top: cy - R, spd: 0, blink: 1 + Math.random() * 4, blinkT: 0
  };
  const w = 1 / Math.pow(Rr, MASS_EXP);
  for (let k = 0; k < n; k++) {
    const th = 2 * Math.PI * k / n, c = Math.cos(th), s = Math.sin(th);
    b.rx[k] = c; b.ry[k] = s;
    const i = E.NB + k;
    X[i] = cx + c * Rr * sc; Y[i] = cy + s * Rr * sc; PX[i] = X[i]; PY[i] = Y[i];
    VX[i] = vx; VY[i] = vy; IW[i] = w; OWN[i] = b.index;
  }
  E.NB += n; E.blobs.push(b);
  return b;
}

function clearAll() { E.blobs = []; E.NB = 0; E.mergeQ.length = 0; E.events.length = 0; }

function solveBlob(b) {
  const s = b.start, n = b.n, e = s + n, sc = b.scale;
  // skin: keep neighbouring beads at their rest distance
  const L0 = b.rest * sc;
  for (let k = 0; k < n; k++) {
    const i = s + k, j = k + 1 < n ? i + 1 : s;
    const dx = X[j] - X[i], dy = Y[j] - Y[i];
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-9) continue;
    const c = 0.5 * KE * (d - L0) / d;
    X[i] += dx * c; Y[i] += dy * c; X[j] -= dx * c; Y[j] -= dy * c;
  }
  // pressure: keep the enclosed area
  let A = 0;
  for (let k = 0; k < n; k++) { const i = s + k, j = k + 1 < n ? i + 1 : s; A += X[i] * Y[j] - X[j] * Y[i]; }
  A *= 0.5;
  const C = A - b.area0 * b.slack * sc * sc;
  let sg = 0;
  for (let k = 0; k < n; k++) {
    const ip = k + 1 < n ? s + k + 1 : s, im = k > 0 ? s + k - 1 : e - 1;
    const gx = 0.5 * (Y[ip] - Y[im]), gy = 0.5 * (X[im] - X[ip]);
    TGX[k] = gx; TGY[k] = gy; sg += gx * gx + gy * gy;
  }
  if (sg > 1e-12) {
    let lam = -KA * C / sg;
    const lim = 0.04 / Math.sqrt(sg / n);
    if (lam > lim) lam = lim; else if (lam < -lim) lam = -lim;
    for (let k = 0; k < n; k++) { X[s + k] += lam * TGX[k]; Y[s + k] += lam * TGY[k]; }
  }
  // jelly: gently pull towards the rotated rest circle
  let cx = 0, cy = 0;
  for (let i = s; i < e; i++) { cx += X[i]; cy += Y[i]; }
  cx /= n; cy /= n;
  let sa = 0, ca = 0;
  for (let k = 0; k < n; k++) {
    const dx = X[s + k] - cx, dy = Y[s + k] - cy;
    sa += b.rx[k] * dy - b.ry[k] * dx; ca += b.rx[k] * dx + b.ry[k] * dy;
  }
  const m = Math.sqrt(sa * sa + ca * ca);
  if (m > 1e-9) {
    sa /= m; ca /= m;
    const r = b.Rr * sc;
    for (let k = 0; k < n; k++) {
      const gx = cx + r * (ca * b.rx[k] - sa * b.ry[k]), gy = cy + r * (sa * b.rx[k] + ca * b.ry[k]);
      X[s + k] += (gx - X[s + k]) * b.ks; Y[s + k] += (gy - Y[s + k]) * b.ks;
    }
  }
}

function buildGrid() {
  const nb = E.NB;
  cellStart.fill(0);
  for (let i = 0; i < nb; i++) {
    let cx = ((X[i] - GX0) / CELL) | 0, cy = ((Y[i] - GY0) / CELL) | 0;
    if (cx < 0) cx = 0; else if (cx >= GW) cx = GW - 1;
    if (cy < 0) cy = 0; else if (cy >= GH) cy = GH - 1;
    const c = cy * GW + cx;
    beadCell[i] = c; cellStart[c + 1]++;
  }
  for (let c = 0; c < GN; c++) { cellStart[c + 1] += cellStart[c]; cellCur[c] = cellStart[c]; }
  for (let i = 0; i < nb; i++) cellItems[cellCur[beadCell[i]]++] = i;
}

function collide() {
  const nb = E.NB, bl = E.blobs;
  for (let i = 0; i < nb; i++) {
    const c = beadCell[i], gx = c % GW, gy = (c / GW) | 0, oi = OWN[i];
    const x0 = gx > 0 ? gx - 1 : 0, x1 = gx < GW - 1 ? gx + 1 : gx;
    const y0 = gy > 0 ? gy - 1 : 0, y1 = gy < GH - 1 ? gy + 1 : gy;
    for (let yy = y0; yy <= y1; yy++) {
      for (let xx = x0; xx <= x1; xx++) {
        const cc = yy * GW + xx, ce = cellStart[cc + 1];
        for (let k = cellStart[cc]; k < ce; k++) {
          const j = cellItems[k];
          if (j <= i) continue;
          const oj = OWN[j];
          if (oj === oi) continue;
          let dx = X[j] - X[i], dy = Y[j] - Y[i];
          const d2 = dx * dx + dy * dy;
          if (d2 >= CD2) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-6) { dx = 1e-3; dy = 0; d = 1e-3; }
          const nx = dx / d, ny = dy / d, pen = CD - d;
          const wi = IW[i], wj = IW[j], ws = wi + wj, corr = pen / ws;
          X[i] -= nx * corr * wi; Y[i] -= ny * corr * wi;
          X[j] += nx * corr * wj; Y[j] += ny * corr * wj;
          // friction: cancel part of the sliding motion (Coulomb-like)
          const rx = (X[j] - PX[j]) - (X[i] - PX[i]), ry = (Y[j] - PY[j]) - (Y[i] - PY[i]);
          const rn = rx * nx + ry * ny, tx = rx - rn * nx, ty = ry - rn * ny;
          const tl = Math.sqrt(tx * tx + ty * ty);
          if (tl > 1e-9) {
            const f = Math.min(1, MU * pen / tl) / ws;
            X[i] += tx * f * wi; Y[i] += ty * f * wi; X[j] -= tx * f * wj; Y[j] -= ty * f * wj;
          }
          const A = bl[oi], B = bl[oj];
          A.touched = true; B.touched = true;
          if (A.level === B.level && !A.merging && !B.merging) {
            A.merging = true; B.merging = true; E.mergeQ.push(A, B);
          }
        }
      }
    }
  }
}

// the wagon's mouth widens like a funnel above FUN_Y
const FUN_Y = 3.4, FUN_W = 1.0, FUN_TOP = -0.3;
function funnelAt(y) { return y >= FUN_Y ? 0 : Math.min(1, (FUN_Y - y) / (FUN_Y - FUN_TOP)) * FUN_W; }
function walls() {
  const nb = E.NB, ymax = FLOOR_Y - RB;
  for (let i = 0; i < nb; i++) {
    const fw = funnelAt(Y[i]), xmin = RB - fw, xmax = WORLD_W - RB + fw;
    if (X[i] < xmin || X[i] > xmax) {
      const pen = X[i] < xmin ? xmin - X[i] : X[i] - xmax;
      X[i] = X[i] < xmin ? xmin : xmax;
      const dy = Y[i] - PY[i], f = Math.min(Math.abs(dy), WALL_MU * pen);
      Y[i] -= dy > 0 ? f : -f;
    }
    if (Y[i] > ymax) {
      const pen = Y[i] - ymax;
      Y[i] = ymax;
      const dx = X[i] - PX[i], f = Math.min(Math.abs(dx), FLOOR_MU * pen);
      X[i] -= dx > 0 ? f : -f;
      E.blobs[OWN[i]].touched = true;
    }
  }
}


// push any bead that ended up inside another blob back out through the nearest skin edge
const BBX0 = [], BBX1 = [], BBY0 = [], BBY1 = [];
function unpenetrate() {
  const bl = E.blobs, nbl = bl.length;
  for (let q = 0; q < nbl; q++) {
    const b = bl[q], s = b.start, e = s + b.n;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let i = s; i < e; i++) { const x = X[i], y = Y[i]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    BBX0[q] = x0; BBX1[q] = x1; BBY0[q] = y0; BBY1[q] = y1;
  }
  for (let qa = 0; qa < nbl; qa++) {
    const A = bl[qa], as = A.start, an = A.n;
    for (let qb = 0; qb < nbl; qb++) {
      if (qb === qa || BBX0[qb] > BBX1[qa] || BBX1[qb] < BBX0[qa] || BBY0[qb] > BBY1[qa] || BBY1[qb] < BBY0[qa]) continue;
      const B = bl[qb], be = B.start + B.n;
      for (let j = B.start; j < be; j++) {
        const px = X[j], py = Y[j];
        if (px < BBX0[qa] || px > BBX1[qa] || py < BBY0[qa] || py > BBY1[qa]) continue;
        let inside = false;
        for (let k = 0, m = an - 1; k < an; m = k++) {
          const yi = Y[as + k], yj = Y[as + m];
          if ((yi > py) !== (yj > py) && px < (X[as + m] - X[as + k]) * (py - yi) / (yj - yi) + X[as + k]) inside = !inside;
        }
        if (!inside) continue;
        let best = 1e9, bx = 0, by = 0, bnx = 0, bny = 0, bk = 0;
        for (let k = 0; k < an; k++) {
          const i1 = as + k, i2 = as + (k + 1 < an ? k + 1 : 0);
          const ex = X[i2] - X[i1], ey = Y[i2] - Y[i1], l2 = ex * ex + ey * ey || 1e-9;
          let t = ((px - X[i1]) * ex + (py - Y[i1]) * ey) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = X[i1] + ex * t, qy = Y[i1] + ey * t, d2 = (px - qx) * (px - qx) + (py - qy) * (py - qy);
          if (d2 < best) { const l = Math.sqrt(l2); best = d2; bx = qx; by = qy; bnx = ey / l; bny = -ex / l; bk = k; }
        }
        // move the bead out, and nudge the skin it crossed inward a little
        const tx = bx + bnx * RB * 1.05, ty = by + bny * RB * 1.05, dx = tx - px, dy = ty - py;
        X[j] += dx; Y[j] += dy; PX[j] += dx * 0.7; PY[j] += dy * 0.7;
        const i1 = as + bk, i2 = as + (bk + 1 < an ? bk + 1 : 0);
        X[i1] -= bnx * RB * 0.3; Y[i1] -= bny * RB * 0.3; X[i2] -= bnx * RB * 0.3; Y[i2] -= bny * RB * 0.3;
      }
    }
  }
}

function substep() {
  const nb = E.NB, g = E.gy * H, gxh = E.gx * H, bl = E.blobs;
  for (let i = 0; i < nb; i++) {
    VY[i] += g; VX[i] += gxh; PX[i] = X[i]; PY[i] = Y[i];
    X[i] += VX[i] * H; Y[i] += VY[i] * H;
  }
  for (let q = 0; q < bl.length; q++) solveBlob(bl[q]);
  buildGrid(); collide(); walls();
  if (E.hook) E.hook();
  const ih = 1 / H;
  for (let q = 0; q < bl.length; q++) {
    const b = bl[q], s = b.start, n = b.n, e = s + n;
    let mx = 0, my = 0, cx = 0, cy = 0;
    for (let i = s; i < e; i++) {
      const vx = (X[i] - PX[i]) * ih, vy = (Y[i] - PY[i]) * ih;
      VX[i] = vx; VY[i] = vy; mx += vx; my += vy; cx += X[i]; cy += Y[i];
    }
    mx /= n; my /= n; cx /= n; cy /= n;
    // damp wobble only: keep the blob's own travel and spin
    let L = 0, I = 0;
    for (let i = s; i < e; i++) {
      const rx = X[i] - cx, ry = Y[i] - cy;
      L += rx * (VY[i] - my) - ry * (VX[i] - mx); I += rx * rx + ry * ry;
    }
    // a little rolling resistance, and resting blobs come to a stop instead of creeping
    const w = I > 1e-9 ? L / I : 0, wk = w * ANG_KEEP;
    const gd = b.touched && mx * mx + my * my < REST_V * REST_V ? GLOB_DAMP * REST_DAMP : GLOB_DAMP;
    for (let i = s; i < e; i++) {
      const rx = X[i] - cx, ry = Y[i] - cy, bx = mx - w * ry, by = my + w * rx;
      let vx = (mx - wk * ry + (VX[i] - bx) * INT_DAMP) * gd, vy = (my + wk * rx + (VY[i] - by) * INT_DAMP) * gd;
      const v2 = vx * vx + vy * vy;
      if (v2 > VMAX * VMAX) { const f = VMAX / Math.sqrt(v2); vx *= f; vy *= f; }
      VX[i] = vx; VY[i] = vy;
    }
  }
}

function centroidVel(b) {
  const s = b.start, e = s + b.n;
  let x = 0, y = 0, vx = 0, vy = 0;
  for (let i = s; i < e; i++) { x += X[i]; y += Y[i]; vx += VX[i]; vy += VY[i]; }
  return { x: x / b.n, y: y / b.n, vx: vx / b.n, vy: vy / b.n };
}

function compact() {
  const old = E.blobs, keep = [];
  let w = 0;
  for (let q = 0; q < old.length; q++) {
    const b = old[q];
    if (!b.alive) continue;
    if (b.start !== w) {
      const s = b.start, e = s + b.n;
      X.copyWithin(w, s, e); Y.copyWithin(w, s, e); PX.copyWithin(w, s, e); PY.copyWithin(w, s, e);
      VX.copyWithin(w, s, e); VY.copyWithin(w, s, e); IW.copyWithin(w, s, e);
    }
    b.start = w; b.index = keep.length; OWN.fill(b.index, w, w + b.n);
    w += b.n; keep.push(b);
  }
  E.blobs = keep; E.NB = w;
}

function processMerges() {
  const q = E.mergeQ;
  if (!q.length) return;
  let changed = false;
  for (let k = 0; k < q.length; k += 2) {
    const A = q[k], B = q[k + 1];
    if (!A.alive || !B.alive) continue;
    const a = centroidVel(A), b = centroidVel(B);
    A.alive = false; B.alive = false; changed = true;
    const L = A.level, vx = (a.vx + b.vx) / 2, vy = (a.vy + b.vy) / 2;
    const host = a.y >= b.y ? a : b, other = host === a ? b : a;
    if (L < MAXL) {
      const s0 = Math.min(0.95, 0.72 * RADII[L] / RADII[L + 1]);
      const nb = makeBlob(L + 1, host.x, host.y, vx, vy, s0);
      if (nb) { nb.touched = true; nb.age = 0.3; }
      E.events.push({ type: 'merge', level: L + 1, x: host.x, y: host.y, ox: other.x, oy: other.y });
    } else {
      E.events.push({ type: 'max', level: L, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    }
  }
  q.length = 0;
  if (changed) compact();
}

function updateInfo() {
  const bl = E.blobs;
  for (let q = 0; q < bl.length; q++) {
    const b = bl[q], s = b.start, n = b.n, e = s + n;
    let x = 0, y = 0, vx = 0, vy = 0, top = 1e9;
    for (let i = s; i < e; i++) { x += X[i]; y += Y[i]; vx += VX[i]; vy += VY[i]; if (Y[i] < top) top = Y[i]; }
    x /= n; y /= n;
    b.cx = x; b.cy = y; b.vx = vx / n; b.vy = vy / n; b.top = top - RB;
    b.spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    let sa = 0, ca = 0;
    for (let k = 0; k < n; k++) {
      const dx = X[s + k] - x, dy = Y[s + k] - y;
      sa += b.rx[k] * dy - b.ry[k] * dx; ca += b.rx[k] * dx + b.ry[k] * dy;
    }
    b.ang = Math.atan2(sa, ca);
  }
}

function stepPhysics() {
  const bl = E.blobs;
  for (let q = 0; q < bl.length; q++) {
    const b = bl[q];
    b.age += STEP;
    if (b.gt < GROW_T) {
      b.gt = Math.min(GROW_T, b.gt + STEP);
      b.scale = b.s0 + (1 - b.s0) * easeOutBack(b.gt / GROW_T);
    } else b.scale = 1;
  }
  for (let s = 0; s < SUB; s++) { substep(); unpenetrate(); }
  processMerges();
  updateInfo();
}

  const top = Math.min(SPAWN_W.length - 1, Math.max(4, maxLevel - 3));

  return 0;
}

    const k = 'piispanpeli-daily-' + todayKey(), prev = Number(store.get(k, 0)) || 0;
    newBest = !prev || shots < prev; if (newBest) store.set(k, shots);
    unlock('daily'); if (shots < 60) unlock('daily60');
  } else if (gmode === 'map' && reason === 'win') {
    if (missionIdx + 1 > mapDone()) store.set('piispanpeli-map', missionIdx + 1);
    if (mapDone() >= 3) unlock('map3');
    if (mapDone() >= MISSIONS.length) unlock('mapAll');
  }
  if (gmode === 'time') { if (score >= 5000) unlock('time5k'); if (score >= 15000) unlock('time15k'); }
  E.gx = 0; E.gy = GRAV;
  store.set(AUTO_KEY, null);
  if (maxLevel > bestLevel) { bestLevel = maxLevel; store.set('piispanpeli-level', bestLevel); }
  if (reason === 'win') { sfx.mega(); triggerConfetti(); } else sfx.over();
  if (!reduceMotion && reason !== 'win') shake = Math.max(shake, 0.25);
  syncUI();
  setTimeout(() => { if (state === 'over') showOver(newBest); }, 1000);
}

function shoot() {
  if (state !== 'play' || cooldown > 0) return;
  const R = RADII[cur], lim = (R + RB) * (R + RB);
  for (let i = 0; i < E.NB; i++) {
    const dx = X[i] - LX, dy = Y[i] - LY;
    if (dx * dx + dy * dy < lim) { blockedT = 0.9; sfx.blocked(); return; }
  }
  const sp = 3 + aimPow * 29;
  const b = makeBlob(cur, LX, LY, Math.sin(aimAng) * sp, Math.cos(aimAng) * sp, 1);
  if (!b) return;
  maxLevel = Math.max(maxLevel, cur); noteLevel(cur); shots++;
  sfx.shoot(aimPow);
  cur = nxt; nxt = randLevel(); cooldown = 0.32; popT = 0;
}

// ------------------------------ effects ------------------------------
function triggerConfetti() { for (let l = 0; l <= MAXL; l++) burst(WORLD_W / 2, 6, l, 4, 3); }
function burst(x, y, level, count, R) {
  if (reduceMotion) count = Math.ceil(count / 3);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, sp = rand(2.5, 7) * (0.7 + R * 0.25), life = rand(0.45, 0.8);
    parts.push({ k: 0, x: x + Math.cos(a) * R * 0.6, y: y + Math.sin(a) * R * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,

  }
}
function ring(x, y, R, level) { parts.push({ k: 1, x, y, r: R * 0.7, r1: R * 1.55, life: 0.35, max: 0.35, c: PAL[level].light }); }
function floater(text, x, y, color, size) { floaters.push({ text, x, y, life: 1.1, max: 1.1, color, size }); }

function handleEvent(ev) {
  if (ev.type === 'merge') {
    const R = RADII[ev.level];
    burst(ev.x, ev.y, ev.level, 8 + ev.level * 2, R); ring(ev.x, ev.y, R, ev.level);
    if (ev.level >= 4) mascotBounce = 1;
    sfx.merge(ev.level);
    if (ev.level >= 7 && !reduceMotion) shake = Math.max(shake, 0.1 + (ev.level - 7) * 0.06);
    if (state !== 'play') return;
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
    mergesThisGame++; unlock('first'); noteLevel(ev.level);
    if (combo >= 5) unlock('combo5'); if (combo >= 10) unlock('combo10'); if (mergesThisGame >= 100) unlock('merges100');
    const pts = POINTS[ev.level] * combo;
    addScore(pts);
    floater('+' + pts, ev.x, ev.y, PAL[ev.level].light, 17 + ev.level * 1.5);
    if (combo >= 2) floater(T('Kombo ×{0}', combo), ev.x, ev.y - R - 0.5, '#fff7ee', 19);
    else if (ev.level >= 2) floater(NAMES[ev.level], ev.x, ev.y - R - 0.5, '#ffe066', 16 + ev.level);
    if (ev.level > maxLevel) {
      if (ev.level >= 5 && ev.level > bestLevel) floater(T('Uusi maa: {0}!', NAMES[ev.level]), ev.x, ev.y - R - 1.1, '#ffe066', 22);
      maxLevel = ev.level;
    }
  } else if (ev.type === 'max') {
    for (let l = 0; l <= MAXL; l++) burst(ev.x, ev.y, l, 5, 2.5);
    ring(ev.x, ev.y, 3.2, MAXL); sfx.mega();
    if (!reduceMotion) shake = 0.45;
    if (state !== 'play') return;
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
    unlock('union');
    const pts = MAX_BONUS * combo;
    addScore(pts);
    floater(T('Eurooppa yhdistyi! +{0}', pts), ev.x, ev.y, '#ffe066', 28);
  }
}

function addScore(p) {
  if (gmode === 'zen') return;
  score += p; abilProg += p;
  if (state === 'play') { if (score >= 10000) unlock('s10k'); if (score >= 100000) unlock('s100k'); }
  while (abilProg >= ABIL_COST) { abilProg -= ABIL_COST; charges++; floater(T('Heilautus valmis!'), WORLD_W / 2, 6, '#ffcc00', 24); }
  syncAbil();
}
function syncAbil() {
  const on = state === 'play' || state === 'paused';
  abilBtn.hidden = !on;
  if (!on) return;
  abilBtn.disabled = charges <= 0 || wobT > 0;
  abilBtn.classList.toggle('ready', charges > 0 && wobT <= 0);
  const fmt = n => n >= 1000 ? (Math.floor(n / 100) / 10).toString().replace(/\.0$/, '') + 'k' : String(Math.floor(n));
  abilBtn.textContent = charges > 0 ? T('Heilauta! ×{0}', charges) : T('Heilautus {0} / {1}', fmt(abilProg), fmt(ABIL_COST));
  abilBtn.style.setProperty('--p', charges > 0 ? '100%' : (abilProg / ABIL_COST * 100).toFixed(1) + '%');
  abilBtn.setAttribute('aria-label', charges > 0 ? T('Heilauta vaunua, {0} käytettävissä', charges) : T('Heilautus latautuu, {0} / {1} pistettä', Math.floor(abilProg), ABIL_COST));
}
function useAbility() {
  if (state !== 'play' || charges <= 0 || wobT > 0) return;
  charges--; wobT = 1.4; unlock('shake');
  // throw everything up a bit, then rock the wagon from side to side
  for (const b of E.blobs) {
    const kick = 12 + Math.random() * 12, side = (Math.random() - 0.5) * 12;
    for (let i = b.start; i < b.start + b.n; i++) { VY[i] -= kick; VX[i] += side; }
  }
  if (!reduceMotion) shake = Math.max(shake, 0.35);
  sfx.mega(); mascotBounce = 1; dangerT = 0;
  floater(T('HEILAUTUS!'), WORLD_W / 2, 7, '#ffcc00', 30);
  syncAbil();
}
function wobbleStep() {
  if (wobT <= 0) return;
  wobT -= STEP;
  const a = Math.sin((1.4 - wobT) * TAU * 2.2) * 110 * Math.min(1, wobT / 0.4) * STEP;
  for (let i = 0; i < E.NB; i++) VX[i] += a;
  if (wobT <= 0) { wobT = 0; syncAbil(); }
}

// two buttons on the wagon walls: game over when balls press both all the way at once
function checkDanger() {
  // how hard each button is pressed = how many bead contacts lean on it
  const y0 = BTN_Y - BTN_H / 2 - RB, y1 = BTN_Y + BTN_H / 2 + RB, lim = RB + 0.15;
  let cl = 0, cr = 0;
  for (let i = 0; i < E.NB; i++) {
    const y = Y[i];
    if (y < y0 || y > y1) continue;
    if (X[i] < lim) cl++; else if (X[i] > WORLD_W - lim) cr++;
  }
  // gauge level grows with how many bead contacts press the button (green → yellow → red)
  tgtL = cl > 0 ? Math.min(1, 0.45 + cl / 5) : 0; tgtR = cr > 0 ? Math.min(1, 0.45 + cr / 5) : 0;
  btnL = cl > 0; btnR = cr > 0;
  if (btnL && btnR && wobT <= 0) { dangerT += STEP; if (dangerT >= DANGER_TIME) gameOver(); }
  else dangerT = Math.max(0, dangerT - STEP * 2);
}

function modeStep() {
  playT += STEP;
  if (playT >= 1800) unlock('marathon');
  if (gmode === 'zen' && playT >= 300) unlock('zen5');
  // "close call": one button red for 5 s and you survive it
  if (btnL !== btnR) oneBtnT += STEP; else { if (!btnL && oneBtnT >= 5) unlock('close'); oneBtnT = 0; }
  if (gmode === 'time') { modeT -= STEP; if (modeT <= 0) { modeT = 0; gameOver('time'); } }
  else if (gmode === 'daily') { if (maxLevel >= 10) gameOver('win'); }
  else if (gmode === 'gravity') {
    gravT -= STEP;
    if (gravT <= 0) {
      gravI = (gravI + 1) % GRAVS.length; gravT = 10 + Math.random() * 6;
      floater(T('Painovoima: {0}!', GRAVS[gravI][2]), WORLD_W / 2, 7, '#7fe7ff', 24); sfx.blocked();
    }
    const [gx, gy] = GRAVS[gravI];
    E.gx += (gx - E.gx) * 0.03; E.gy += (gy - E.gy) * 0.03;
  } else if (gmode === 'map') {
    const ms = MISSIONS[missionIdx];
    const ok = (ms.level != null && maxLevel >= ms.level) || (ms.score != null && score >= ms.score) || (ms.combo != null && combo >= ms.combo);
    if (ok) { gameOver('win'); return; }
    if (ms.time) { modeT -= STEP; if (modeT <= 0) { modeT = 0; gameOver('fail'); return; } }
    if (ms.shots && shots >= ms.shots) { failT += STEP; if (failT > 4) gameOver('fail'); }
  }
}

function attract() {
  menuT -= STEP;
  if (menuT > 0) return;
  menuT = 1.1;
  if (E.blobs.length >= 24) return;
  for (const b of E.blobs) if (b.top < 6) return;
  const lv = Math.floor(Math.random() * 6), R = RADII[lv];
  makeBlob(lv, rand(R + 0.3, WORLD_W - R - 0.3), -1.5, rand(-1.5, 1.5), 2, 1);
}

function preloadMenu() {
  clearAll();
  const placed = [];
  let tries = 0;
  while (placed.length < 13 && tries < 500) {
    tries++;
    const lv = Math.floor(Math.random() * 7), R = RADII[lv];
    const x = rand(R + 0.1, WORLD_W - R - 0.1), y = rand(6 + R, FLOOR_Y - R - 0.05);
    if (placed.some(p => Math.hypot(p.x - x, p.y - y) < p.R + R + 0.15)) continue;
    placed.push({ x, y, R });
    makeBlob(lv, x, y, 0, 0, 1);
  }
  for (let i = 0; i < 90; i++) stepPhysics();
  E.events.length = 0;
}

function stepGame() {
  if (state === 'play') {
    if (keys.ArrowLeft || keys.KeyA) aimAng = Math.max(-1.3, aimAng - 1.5 * STEP);
    if (keys.ArrowRight || keys.KeyD) aimAng = Math.min(1.3, aimAng + 1.5 * STEP);
    if (keys.ArrowUp || keys.KeyW) aimPow = Math.min(1, aimPow + 0.8 * STEP);
    if (keys.ArrowDown || keys.KeyS) aimPow = Math.max(0.03, aimPow - 0.8 * STEP);
    if (cooldown > 0) cooldown = Math.max(0, cooldown - STEP);
    autoT += STEP;
    if (autoT > 4) { autoT = 0; autoSave(); }
  } else if (state === 'menu') attract();
  stepPhysics(); trophyStep();
  for (let i = 0; i < E.events.length; i++) handleEvent(E.events[i]);
  E.events.length = 0;
  if (state === 'play') {
    modeStep();
    if (state !== 'play') return;
    wobbleStep(); checkDanger(); bonusStep();
    // launcher jammed: is there room for the waiting ball?
    const R = RADII[cur], lim = (R + RB) * (R + RB);
    let jam = false;
    for (let i = 0; i < E.NB; i++) { const dx = X[i] - LX, dy = Y[i] - LY; if (dx * dx + dy * dy < lim) { jam = true; break; } }
    if (jam) { jamT += STEP; if (jamT > 4) gameOver(); } else jamT = 0;
  }
  if (comboT > 0) { comboT -= STEP; if (comboT <= 0) combo = 0; }
}

function updateFx(dt) {
  depL += (tgtL - depL) * Math.min(1, dt * 14); depR += (tgtR - depR) * Math.min(1, dt * 14);
  updateNelli(dt);
  mascotBounce = Math.max(0, mascotBounce - dt * 3);
  time += dt; popT += dt;
  if (blockedT > 0) blockedT -= dt;
  shownScore += (score - shownScore) * Math.min(1, dt * 10);
  if (Math.abs(score - shownScore) < 0.5) shownScore = score;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.4);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.k === 0) { p.vy += 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 1.3 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (const b of E.blobs) {
    b.blink -= dt;
    if (b.blink <= 0) { b.blinkT = 0.13; b.blink = rand(2.2, 6); }
    if (b.blinkT > 0) b.blinkT -= dt;
  }
}

// ------------------------------ drawing ------------------------------
const OLX = new Float64Array(512), OLY = new Float64Array(512);
function worldTf(sx, sy) { ctx.setTransform(dpr * SC, 0, 0, dpr * SC, dpr * (OX + sx), dpr * (OY + sy)); }
function screenTf() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

function drawFlag(level, S) {
  const [type, cols, wts] = FLAGS[level];
  if (type === 'tr') {
    // red with white crescent and star
    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, 2 * S);
    ctx.fillStyle = cols[1]; ctx.beginPath(); ctx.arc(-0.12 * S, 0, 0.36 * S, 0, TAU); ctx.fill();
    ctx.fillStyle = cols[0]; ctx.beginPath(); ctx.arc(-0.03 * S, 0, 0.29 * S, 0, TAU); ctx.fill();
    ctx.fillStyle = cols[1]; ctx.beginPath();
    for (let p = 0; p < 10; p++) { const r = p % 2 ? 0.07 * S : 0.17 * S, a = p * Math.PI / 5; ctx.lineTo(0.32 * S + Math.cos(a) * r, Math.sin(a) * r); }
    ctx.fill();
    return;
  }
  if (type === 'su') {
    // red flag with gold star, hammer and sickle
    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, 2 * S);
    ctx.strokeStyle = cols[1]; ctx.fillStyle = cols[1]; ctx.lineCap = 'round';
    ctx.lineWidth = 0.04 * S; ctx.beginPath();
    for (let p = 0; p <= 10; p++) { const r = p % 2 ? 0.05 * S : 0.12 * S, a = -Math.PI / 2 + p * Math.PI / 5; ctx.lineTo(-0.3 * S + Math.cos(a) * r, -0.6 * S + Math.sin(a) * r); }
    ctx.stroke();
    ctx.lineWidth = 0.09 * S;
    ctx.beginPath(); ctx.arc(-0.28 * S, -0.12 * S, 0.27 * S, -0.35 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.5 * S, 0.12 * S); ctx.lineTo(-0.62 * S, 0.24 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.52 * S, 0.2 * S); ctx.lineTo(-0.12 * S, -0.3 * S); ctx.stroke();
    ctx.lineWidth = 0.1 * S; ctx.beginPath(); ctx.moveTo(-0.24 * S, -0.42 * S); ctx.lineTo(-0.02 * S, -0.2 * S); ctx.stroke();
    return;
  }
  if (type === 'gl') {
    // white over red, circle with the colours swapped
    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, S);
    ctx.fillStyle = cols[1]; ctx.fillRect(-S, 0, 2 * S, S);
    ctx.beginPath(); ctx.arc(0, 0, 0.42 * S, Math.PI, 0); ctx.fill();
    ctx.fillStyle = cols[0]; ctx.beginPath(); ctx.arc(0, 0, 0.42 * S, 0, Math.PI); ctx.fill();
    return;
  }
  if (type === 'n') {
    // Nordic cross
    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, 2 * S);
    ctx.fillStyle = cols[1];
    const t = 0.34 * S, cx = -0.22 * S;
    ctx.fillRect(cx - t / 2, -S, t, 2 * S); ctx.fillRect(-S, -t / 2, 2 * S, t);
    return;
  }
  const w = wts || cols.map(() => 1), sum = w.reduce((a, b) => a + b, 0);
  let p = -S;
  for (let i = 0; i < cols.length; i++) {
    const len = 2 * S * w[i] / sum;
    ctx.fillStyle = cols[i];
    if (type === 'v') ctx.fillRect(p, -S, len + 0.02 * S, 2 * S); else ctx.fillRect(-S, p, 2 * S, len + 0.02 * S);
    p += len;
  }
}

function paintBall(path, level, cx, cy, R, ang, lw) {
  ctx.save(); ctx.clip(path);
  ctx.translate(cx, cy); ctx.rotate(ang); drawFlag(level, R * 1.3);
  ctx.restore();
  const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.42, R * 0.05, cx, cy, R * 1.12);
  g.addColorStop(0, 'rgba(255,255,255,0.38)'); g.addColorStop(0.45, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(5,15,45,0.42)');
  ctx.fillStyle = g; ctx.fill(path);
  ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(8,20,55,0.75)'; ctx.stroke(path);
  ctx.save(); ctx.clip(path);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(cx - R * 0.36, cy - R * 0.5, R * 0.3, R * 0.15, -0.55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(cx - R * 0.6, cy - R * 0.28, R * 0.05, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawFace(cx, cy, R, ang, blink, mood) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  const ex = R * 0.3, ey = -R * 0.06, er = R * 0.095;
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  if (nelliT > 0) {
    ctx.fillStyle = '#e01e37';
    heartPath(ctx, -ex, ey + er * 0.3, er * 1.5); ctx.fill();
    heartPath(ctx, ex, ey + er * 0.3, er * 1.5); ctx.fill();
  } else if (blink) {
    ctx.lineWidth = er * 0.55; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.moveTo(-ex - er * 0.9, ey); ctx.lineTo(-ex + er * 0.9, ey); ctx.moveTo(ex - er * 0.9, ey); ctx.lineTo(ex + er * 0.9, ey); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.ellipse(-ex, ey, er * 1.12, er * 1.3, 0, 0, TAU);
    ctx.moveTo(ex + er * 1.12, ey); ctx.ellipse(ex, ey, er * 1.12, er * 1.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(-ex, ey, er * 0.82, er, 0, 0, TAU);
    ctx.moveTo(ex + er * 0.82, ey); ctx.ellipse(ex, ey, er * 0.82, er, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-ex - er * 0.25, ey - er * 0.38, er * 0.32, 0, TAU);
    ctx.moveTo(ex - er * 0.25 + er * 0.32, ey - er * 0.38); ctx.arc(ex - er * 0.25, ey - er * 0.38, er * 0.32, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,80,130,0.3)';
  ctx.beginPath(); ctx.ellipse(-R * 0.5, R * 0.13, R * 0.13, R * 0.075, 0, 0, TAU);
  ctx.moveTo(R * 0.63, R * 0.13); ctx.ellipse(R * 0.5, R * 0.13, R * 0.13, R * 0.075, 0, 0, TAU); ctx.fill();
  if (mood === 1) {
    ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, R * 0.17, er * 0.62, er * 0.8, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = R * 0.11;
    ctx.beginPath(); ctx.arc(0, R * 0.07, R * 0.12, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = R * 0.05;
    ctx.beginPath(); ctx.arc(0, R * 0.07, R * 0.12, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function blobPath(b) {
  const s = b.start, n = b.n;
  for (let k = 0; k < n; k++) {
    const i = s + k, ip = k + 1 < n ? i + 1 : s, im = k > 0 ? i - 1 : s + n - 1;
    const tx = X[ip] - X[im], ty = Y[ip] - Y[im], tl = Math.sqrt(tx * tx + ty * ty) || 1;
    OLX[k] = X[i] + ty / tl * RB; OLY[k] = Y[i] - tx / tl * RB;
  }
  const p = new Path2D();
  p.moveTo((OLX[n - 1] + OLX[0]) * 0.5, (OLY[n - 1] + OLY[0]) * 0.5);
  for (let k = 0; k < n; k++) {
    const k2 = k + 1 < n ? k + 1 : 0;
    p.quadraticCurveTo(OLX[k], OLY[k], (OLX[k] + OLX[k2]) * 0.5, (OLY[k] + OLY[k2]) * 0.5);
  }
  p.closePath();
  return p;
}

function drawBlob(b) {
  const R = b.R * b.scale;
  paintBall(blobPath(b), b.level, b.cx, b.cy, R, b.ang, 0.06);
  drawFace(b.cx, b.cy, R, b.ang, b.blinkT > 0, b.spd > 7 ? 1 : 0);
}

function drawRoundBlob(level, cx, cy, R, sq, lw, face) {
  const k = Math.sqrt(sq);
  const p = new Path2D(); p.ellipse(cx, cy, R / k, R * k, 0, 0, TAU);
  paintBall(p, level, cx, cy, R, 0, lw);
  if (face) drawFace(cx, cy, R, 0, false, 0);
}

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function drawCup(x, y, s) {
  // a small gold cup centred at (x, y)

function predict() {
  const R = RADII[cur], sp = 3 + aimPow * 29;
  let x = LX, y = LY, vx = Math.sin(aimAng) * sp, vy = Math.cos(aimAng) * sp;
  const pts = [], dt = 1 / 90;
  let hit = null;
  for (let k = 0; k < 160; k++) {
    vy += E.gy * dt; vx += E.gx * dt; x += vx * dt; y += vy * dt;
    const fw = funnelAt(y);
    if (x < R - fw) { x = R - fw; vx = -vx * 0.35; } else if (x > WORLD_W - R + fw) { x = WORLD_W - R + fw; vx = -vx * 0.35; }
    if (y > FLOOR_Y - R) { hit = { x, y: FLOOR_Y - R }; break; }
    let hb = false;
    for (const b of E.blobs) {
      const dx = x - b.cx, dy = y - b.cy, rr = R + b.R * b.scale * 0.96;
      if (dx * dx + dy * dy < rr * rr) { hb = true; break; }
    }
    if (hb) { hit = { x, y }; break; }
    if (k % 3 === 0 && Math.hypot(x - LX, y - LY) > R + 0.4) pts.push(x, y);
  }
  return { pts, hit };
}

function drawAim() {
  const pr = predict(), n = pr.pts.length;
  ctx.fillStyle = '#fff7ee';
  for (let k = 0; k < n; k += 2) {
    const t = k / Math.max(1, n);
    ctx.globalAlpha = 0.6 - t * 0.4;
    ctx.beginPath(); ctx.arc(pr.pts[k], pr.pts[k + 1], 0.085 * (1 - t * 0.45), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (pr.hit) {
    ctx.setLineDash([0.18, 0.14]); ctx.lineWidth = 0.05; ctx.strokeStyle = 'rgba(255,247,238,0.6)';
    ctx.beginPath(); ctx.arc(pr.hit.x, pr.hit.y, RADII[cur], 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawLauncher() {
  const R = RADII[cur], p = Math.min(1, popT / 0.22), s = easeOutBack(p);
  if (s <= 0.02) return;
  const sq = 1 + Math.sin(time * 3.2) * 0.03;

    ctx.lineCap = 'round'; ctx.lineWidth = 0.09;
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath(); ctx.arc(LX, LY, rr, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(LX, LY, rr, -Math.PI / 2, -Math.PI / 2 + TAU * aimPow); ctx.stroke();
  }
  drawRoundBlob(cur, LX, LY, R * s, sq, 0.05, true);
}

// ---- trampolines on the walls all the way up from the buttons ----
const TR_TOP = -0.2, TR_BOT = BTN_Y - BTN_H / 2 - 0.3;
const tramp = [{ flash: 0, y: 0 }, { flash: 0, y: 0 }];
function bumperStep() {
  for (const t of tramp) if (t.flash > 0) t.flash -= STEP * 2.5;
  const hits = new Map(), lim = RB + 0.05;
  for (let i = 0; i < E.NB; i++) {
    const x = X[i];
    if (x > lim && x < WORLD_W - lim) continue;
    const y = Y[i];
    if (y < TR_TOP || y > TR_BOT) continue;
    if (!hits.has(OWN[i])) hits.set(OWN[i], [x < 1 ? 0 : 1, y]);
  }
  for (const [bi, [side, y]] of hits) {
    const b = E.blobs[bi];
    if (b.trampT && time - b.trampT < 0.35) continue;
    b.trampT = time;
    const dir = side ? -1 : 1, kick = 6 + Math.min(6, Math.abs(b.vx) * 0.6);
    for (let i = b.start; i < b.start + b.n; i++) { VX[i] = dir * Math.max(dir * VX[i], 0) + dir * kick; VY[i] -= 2; }
    tramp[side].flash = 1; tramp[side].y = y;
    sfx.bump();
    if (state === 'play') { addScore(10); floater('+10', side ? WORLD_W - 0.8 : 0.8, y, '#7fe7ff', 14); }
  }
}
function drawBumpers() {

    ctx.stroke();

// ---- bonus targets flying across the empty top of the wagon ----
const bonuses = [];
let bonusT = 12;
function bonusStep() {
  bonusT -= STEP;
  if (bonusT <= 0) {
    bonusT = 18 + Math.random() * 16;
    const heart = Math.random() < 0.08, dir = Math.random() < 0.5 ? 1 : -1;
    bonuses.push({ x: dir > 0 ? -0.6 : WORLD_W + 0.6, y: 2.2 + Math.random() * 1.6, vx: dir * (1.2 + Math.random() * 0.8), r: heart ? 0.42 : 0.38, heart, t: 0 });
  }
  for (let i = bonuses.length - 1; i >= 0; i--) {
    const o = bonuses[i];
    o.t += STEP; o.x += o.vx * STEP;
    const oy = o.y + Math.sin(o.t * 2.5) * 0.25;
    if (o.x < -1 || o.x > WORLD_W + 1) { bonuses.splice(i, 1); continue; }
    // any ball touching it collects it
    let hit = false;
    for (const b of E.blobs) {
      const dx = b.cx - o.x, dy = b.cy - oy, rr = b.R * b.scale + o.r;
      if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
    }
    if (hit) {
      bonuses.splice(i, 1);
      unlock(o.heart ? 'heart' : 'star');
      const pts = o.heart ? 1000 : 500;
      addScore(pts);
      for (let l = 0; l < 6; l++) burst(o.x, oy, o.heart ? 0 : 8, 4, 0.8);

function drawChain(x0, y0, vertical, room) {
  const base = RADII.map(r => 8 + r * 2.6), full = base.reduce((a, r) => a + 2 * r, 0) + 5 * (base.length - 1);
  const scale = Math.min(1, room / full), sizes = base.map(r => r * scale), gap = 5 * scale;
  const total = sizes.reduce((a, r) => a + 2 * r, 0) + gap * (sizes.length - 1);
  const seen = Math.max(4, maxLevel, bestLevel);
  let p = vertical ? y0 : x0 - total / 2;
  for (let k = 0; k <= MAXL; k++) {
    const r = sizes[k], cx = vertical ? x0 : p + r, cy = vertical ? p + r : y0;
    if (k <= seen) drawRoundBlob(k, cx, cy, r, 1, Math.max(1, r * 0.08), r > 9);
    else {
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); ctx.stroke();

      ctx.fillText('?', cx, cy + 1); ctx.textBaseline = 'alphabetic';

  }
  ctx.globalAlpha = 1;
}

function modeLine() {

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0; else if (dt > 0.1) dt = 0.1;
  {
    // the world keeps living behind the pause menu too
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 3) { stepGame(); acc -= STEP; n++; }
    if (n === 3) acc = 0;
  }
  updateFx(dt);
  render();
  requestAnimationFrame(frame);
}


// <mascot>
function drawMascot(c, cx, cy, s, t, bounce) {
  const skin = '#f2c7ab', skinD = '#d99c82';
  const by = cy - Math.abs(Math.sin(t * 2.2)) * s * 0.05 - (bounce || 0) * s * 0.25;
  c.save();
  const L = (typeof look !== 'undefined' && look) || { hat: 'bonnet', glasses: 'none', neck: 'chain' };
  // shoulders
  c.fillStyle = skin;
  c.beginPath(); c.ellipse(cx, by + s * 1.55, s * 1.05, s * 0.55, 0, Math.PI, 0); c.fill();
  // neck + head
  c.fillStyle = skin; c.fillRect(cx - s * 0.28, by + s * 0.6, s * 0.56, s * 0.55);
  c.beginPath(); c.ellipse(cx - s * 0.8, by + s * 0.08, s * 0.13, s * 0.2, 0, 0, Math.PI * 2); c.ellipse(cx + s * 0.8, by + s * 0.08, s * 0.13, s * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(cx, by + s * 0.05, s * 0.8, s * 0.92, 0, 0, Math.PI * 2); c.fill();
  c.lineWidth = s * 0.035; c.strokeStyle = skinD; c.stroke();
  mNeck(c, L.neck, cx, by, s, t);
  if (L.hat !== 'bonnet') { c.fillStyle = '#7a4a32'; c.beginPath(); c.ellipse(cx, by - s * 0.45, s * 0.78, s * 0.5, 0, Math.PI, 0); c.fill(); }
  // sleepy eyes with heavy lids, blinking now and then
  const blink = (t % 4.3) < 0.14;
  for (const sx of [-1, 1]) {
    const ex = cx + sx * s * 0.3, ey = by + s * 0.0;
    if (blink) { c.strokeStyle = '#6b4235'; c.lineWidth = s * 0.04; c.beginPath(); c.moveTo(ex - s * 0.14, ey); c.quadraticCurveTo(ex, ey + s * 0.05, ex + s * 0.14, ey); c.stroke(); continue; }
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, ey, s * 0.15, s * 0.085, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#5b3a2c'; c.beginPath(); c.arc(ex + Math.sin(t * 0.7) * s * 0.03, ey + s * 0.02, s * 0.065, 0, Math.PI * 2); c.fill();

  if (gmode === 'daily') {
    const d = Number(store.get('piispanpeli-daily-' + todayKey(), 0)) || 0;
    if (endReason === 'win') { title = T('Päivän haaste läpäisty!'); main = T('{0} laukausta', shots); sub = newBest ? '<p class="sub win">' + T('Päivän paras tulos!') + '</p>' : '<p class="sub">' + T('Tänään paras: {0} laukausta', d) + '</p>'; }

card.addEventListener('change', e => {
  if (e.target.id === 'trackSel') { sfx.ensure(); music.setTrack(Number(e.target.value)); }
  if (e.target.id === 'langSel') { setLang(e.target.value); if (state === 'menu') showMenu(); else if (state === 'paused' && !adminOn) showPause(); }
  if (e.target.id === 'adminBall') { cur = Number(e.target.value); popT = 0; }
});
card.addEventListener('input', e => { if (e.target.id === 'volRange') { sfx.ensure(); sfx.setVolume(Number(e.target.value) / 100); } });
card.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mascot')) {
    mascotTaps++; mascotTapT = 2; mascotBounce = 0.6;
    if (mascotTaps >= 5) { mascotTaps = 0; triggerNelli(); }
    return;
  }
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act, slot = btn.dataset.slot;
  if (act === 'save') { store.set(SLOT_KEY(slot), gameData()); showPause(T('Tallennettu paikkaan {0}.', slot)); return; }
  if (act === 'load') { const g = store.get(SLOT_KEY(slot), null); if (validSave(g)) loadGame(g, false); return; }
  if (act === 'del') { store.set(SLOT_KEY(slot), null); showMenu(); return; }
  if (btn.dataset.item) {
    const slot = btn.dataset.slot;
    look[slot] = btn.dataset.item; store.set('piispanpeli-look', look); mascotBounce = 0.8;
    card.querySelectorAll(`.witem[data-slot="${slot}"]:not(.locked)`).forEach(el => { const on = el === btn; el.classList.toggle('on', on); el.querySelector('small').textContent = T(on ? 'Käytössä' : 'Valitse'); });
    return;
  }
  if (btn.dataset.theme) {
    themeId = btn.dataset.theme; store.set('piispanpeli-theme', themeId); mascotBounce = 0.8; buildBg();
    card.querySelectorAll('.tcard:not(.locked)').forEach(el => { const on = el === btn; el.classList.toggle('on', on); el.querySelector('small').textContent = T(on ? 'Käytössä' : 'Valitse'); });
    return;
  }
  if (btn.dataset.mode) { const m = btn.dataset.mode; if (m === 'map') showMap(); else startGame(m); return; }
  if (btn.dataset.mission != null) { startGame('map', Number(btn.dataset.mission)); return; }
  if (btn.id === 'startBtn') startGame('classic');
  else if (btn.id === 'againBtn' || btn.id === 'restartBtn') startGame();
  else if (btn.id === 'nextMission') startGame('map', missionIdx + 1);
  else if (btn.id === 'modesBtn') showModes();
  else if (btn.id === 'achBtn') showAch();
  else if (btn.id === 'rulesBtn') showRules();
  else if (btn.id === 'wardBtn') showWardrobe();
  else if (btn.id === 'themeBtn') showThemes();
  else if (btn.id === 'backMenu') showMenu();
  else if (btn.id === 'continueBtn') { const g = store.get(AUTO_KEY, null); if (validSave(g)) loadGame(g, true); else startGame(); }
  else if (btn.id === 'resumeBtn') resume();
  else if (btn.id === 'saveBtn') showSaveSlots();
  else if (btn.id === 'admAll') { unlockEverything(); sfx.ensure(); triggerConfetti(); showAdmin(T('Kaikki avattu: saavutukset, teemat, hahmon tavarat, maat ja tehtävät.')); }
  else if (btn.id === 'admCharge') { charges++; syncAbil(); showAdmin(T('Heilautus lisätty.')); }
  else if (btn.id === 'admPts') { addScore(10000); shownScore = score; showAdmin(T('Lisätty 10 000 pistettä.')); }
  else if (btn.id === 'admClear') { clearAll(); dangerT = 0; jamT = 0; showAdmin(T('Vaunu tyhjennetty.')); }
  else if (btn.id === 'admGod') { invincible = !invincible; showAdmin(T(invincible ? 'Kuolemattomuus päällä.' : 'Kuolemattomuus pois.')); }
  else if (btn.id === 'admClose') closeAdmin();
  else if (btn.id === 'admLose') { invincible = false; hideOverlay(); state = 'play'; gameOver(gmode === 'map' || gmode === 'daily' ? 'fail' : 'forced'); }

  else if (btn.id === 'backBtn') showPause();
  else if (btn.id === 'menuBtn') toMenu();
  else if (btn.id === 'installBtn' && installPrompt) {
    const p = installPrompt;
    installPrompt = null;
    p.prompt();
    Promise.resolve(p.userChoice).catch(() => {}).then(renderInstall);
  }
});

// ------------------------------ input ------------------------------
function aimAt(e) {
  const wx = (e.clientX - OX) / SC, wy = (e.clientY - OY) / SC;
  const dx = wx - LX;
  let dy = wy - LY;
  if (dy < 0.3) dy = 0.3;
  aimAng = clamp(Math.atan2(dx, dy), -1.3, 1.3);
  aimPow = clamp((Math.hypot(wx - LX, wy - LY) - 0.9) / 10.5, 0.03, 1);
}
// four quick taps in the top-left corner open the admin panel
window.addEventListener('pointerdown', e => {
  if (e.clientX > 70 || e.clientY > 70) return;
  cornerTaps = performance.now() - cornerT < 1500 ? cornerTaps + 1 : 1; cornerT = performance.now();
  if (cornerTaps >= 4) { cornerTaps = 0; openAdmin(); }
}, true);
canvas.addEventListener('pointerdown', e => {
  if (e.clientX <= 70 && e.clientY <= 70) return;
  sfx.ensure();
  if (state !== 'play' || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const wx = (e.clientX - OX) / SC, wy = (e.clientY - OY) / SC, id = pickTrophy(wx, wy);
  if (id) { heldTrophy = { id, pid: e.pointerId }; sfx.ensure(); return; }
  aiming = true;
  aimAt(e);
});
function releaseTrophy() {
  const o = heldTrophy && TOBJ[heldTrophy.id];
  heldTrophy = null;
  if (!o) return;
  const sp = Math.hypot(o.vx, o.vy), k = sp > 28 ? 28 / sp : 1;
  o.vx *= k; o.vy *= k; o.st = 'fly'; o.t = 0; o.rest = 0; o.va += o.vx * 0.6;
}
canvas.addEventListener('pointermove', e => {
  if (heldTrophy) { const o = TOBJ[heldTrophy.id]; if (o) { o.tx = (e.clientX - OX) / SC; o.ty = (e.clientY - OY) / SC; } return; }
  if (state === 'play' && (aiming || e.pointerType === 'mouse')) aimAt(e);
});
canvas.addEventListener('pointerup', e => {
  if (heldTrophy) { releaseTrophy(); return; }
  if (state !== 'play' || !aiming) return;
  aiming = false; aimAt(e); shoot();
});
canvas.addEventListener('pointercancel', () => { aiming = false; releaseTrophy(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Space') e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (e.key && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-8);
    if (typed.endsWith('nelli')) { typed = ''; triggerNelli(); }
    else if (typed === 'admin123') { typed = ''; openAdmin(); }
  }
  if (state === 'play') {
    if (k === 'Space' || k === 'Enter') shoot();
    else if (k === 'KeyP' || k === 'Escape') pause();
    else if (k === 'KeyH') useAbility();
  } else if (state === 'paused') {
    if (k === 'KeyP' || k === 'Escape' || k === 'Space' || k === 'Enter') resume();
  } else if ((k === 'Space' || k === 'Enter') && !overlay.hidden) {
    const g = state === 'menu' ? store.get(AUTO_KEY, null) : null;
    if (validSave(g)) loadGame(g, true); else startGame('classic');
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play') pause(); else autoSave(); sfx.suspend(); } else sfx.resume(); });
window.addEventListener('pagehide', autoSave);
window.addEventListener('resize', layout);

function syncSound() {
  soundBtn.innerHTML = sfx.muted ? ICON_OFF : ICON_ON;
  soundBtn.setAttribute('aria-label', T(sfx.muted ? 'Laita äänet päälle' : 'Mykistä äänet'));
}
soundBtn.addEventListener('click', () => { sfx.toggle(); syncSound(); soundBtn.blur(); });
abilBtn.addEventListener('click', () => { useAbility(); abilBtn.blur(); });
pauseBtn.addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'paused') resume(); pauseBtn.blur(); });

// ------------------------------ language switching ------------------------------
const FI = {
  names: NAMES.slice(), modes: Object.fromEntries(Object.entries(MODE_INFO).map(([k, v]) => [k, [v.name, v.desc]])),
  missions: MISSIONS.map(m => m.text), ach: ACH.map(a => [a[1], a[2]]), gravs: GRAVS.map(g => g[2]),
  ward: Object.fromEntries(Object.entries(WARDROBE).map(([k, v]) => [k, v.map(it => it[1])])), slots: Object.assign({}, SLOT_NAMES), songs: music.names.slice()
};
function applyLang() {
  FI.names.forEach((n, i) => { NAMES[i] = T(n); });
  for (const k in FI.modes) { MODE_INFO[k].name = T(FI.modes[k][0]); MODE_INFO[k].desc = T(FI.modes[k][1]); }
  FI.missions.forEach((t, i) => { MISSIONS[i].text = T(t); });
  FI.ach.forEach(([n, d], i) => { ACH[i][1] = T(n); ACH[i][2] = T(d); });
  FI.gravs.forEach((g, i) => { GRAVS[i][2] = T(g); });
  for (const k in FI.ward) FI.ward[k].forEach((n, i) => { WARDROBE[k][i][1] = T(n); });
  for (const k in FI.slots) SLOT_NAMES[k] = T(FI.slots[k]);
  FI.songs.forEach((n, i) => { music.names[i] = T(n); });
  document.documentElement.lang = lang;
  canvas.setAttribute('aria-label', T('Pelialue: vaunu täynnä lippupalloja'));
  pauseBtn.setAttribute('aria-label', T('Tauko'));
  if (typeof syncSound === 'function') syncSound();
  if (typeof syncAbil === 'function') syncAbil();
}
function setLang(c) { lang = c; store.set('piispanpeli-lang', c); applyLang(); }
applyLang();

// ------------------------------ boot ------------------------------
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') {
  hot.snapshot(() => ({
    best, bestLevel,
    game: (state === 'play' || state === 'paused') ? gameData() : null
  }));
}

// ------------------------------ opening intro: the PiispanPELI train rolls in ------------------------------
function playIntro() {
  if (reduceMotion || navigator.webdriver) return;
  const cv = document.createElement('canvas');
  cv.id = 'intro'; cv.setAttribute('aria-hidden', 'true');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:60;cursor:pointer;transition:opacity .5s';
  document.body.appendChild(cv);
  const c = cv.getContext('2d');
  let W = 0, H = 0, D = 1, t0 = 0, ending = 0, done = false;
  const size = () => { D = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; };
  size(); window.addEventListener('resize', size);
  const stars = Array.from({ length: 90 }, () => [Math.random(), Math.random() * 0.62, Math.random() * 1.6 + 0.4, Math.random() * TAU]);
  const balls = [7, 9, 10, 2, 5, 11, 0, 8].map((lv, i) => ({ lv, a: -Math.PI / 2 + (i - 3.5) * 0.17, sp: 0.95 + Math.random() * 0.4, d: i * 0.05 }));
  const ease = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
  const back = u => { u = Math.min(1, Math.max(0, u)); const k = 1.9; return 1 + (k + 1) * Math.pow(u - 1, 3) + k * Math.pow(u - 1, 2); };
  function finish() { if (ending) return; ending = performance.now(); cv.style.opacity = '0'; setTimeout(() => { done = true; cv.remove(); window.removeEventListener('resize', size); }, 520); }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); finish(); });
  window.addEventListener('keydown', function k() { finish(); window.removeEventListener('keydown', k); });
  function wheel(x, y, r, rot) {
    c.fillStyle = '#10162a'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.lineWidth = r * 0.18; c.strokeStyle = '#b8c3e0'; c.stroke();
    c.lineWidth = r * 0.1; c.strokeStyle = '#6f7ba0'; c.beginPath();
    for (let k = 0; k < 3; k++) { const a = rot + k * Math.PI / 3; c.moveTo(x - Math.cos(a) * r * 0.8, y - Math.sin(a) * r * 0.8); c.lineTo(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.8); }
    c.stroke(); c.fillStyle = '#ffcc00'; c.beginPath(); c.arc(x, y, r * 0.25, 0, TAU); c.fill();
  }
  function draw(now) {
    if (done) return;
    if (!t0) t0 = now;
    const t = (now - t0) / 1000;
    c.setTransform(D, 0, 0, D, 0, 0);
    // night sky
    const g = c.createRadialGradient(W / 2, H * 0.35, 0, W / 2, H * 0.35, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#1c3c8c'); g.addColorStop(0.55, '#0d2160'); g.addColorStop(1, '#040a22');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (const [sx, sy, r, p] of stars) { c.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(t * 1.5 + p)); c.fillStyle = '#fff'; c.fillRect(sx * W, sy * H, r, r); }
    c.globalAlpha = 1;
    // EU star ring rising behind the title
    const ringA = ease((t - 0.2) / 0.8), cx = W / 2, cy = H * 0.3, rr = Math.min(W, H) * 0.24;
    c.fillStyle = `rgba(255,204,0,${0.85 * ringA})`;
    for (let k = 0; k < 12; k++) { const a = k / 12 * TAU + t * 0.15; starPath(c, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, rr * 0.07, rr * 0.03); c.fill(); }
    // track
    const u = Math.min(W, H) / 12, ty = H * 0.72;
    c.fillStyle = '#3a2a20'; for (let x = (W % (u * 0.9)) / 2; x < W; x += u * 0.9) c.fillRect(x, ty + u * 0.05, u * 0.55, u * 0.16);
    c.fillStyle = '#9aa6c4'; c.fillRect(0, ty - u * 0.04, W, u * 0.1);
    // the train slides in from the right and brakes in the middle
    const k = ease((t - 0.15) / 1.5), tx = W + u * 9 - (W / 2 + u * 9 - u * 1.2) * k, dist = (W + u * 9 - tx) / u, bob = Math.sin(t * 18) * (1 - k) * u * 0.03;
    // steam
    for (let i = 0; i < 9; i++) {
      const age = ((t * 1.2 + i / 9) % 1), px = tx - u * 2.6 + age * u * 1.8, py = ty - u * 3.1 - age * u * 2.4, pr = u * (0.25 + age * 0.6);
      c.fillStyle = `rgba(230,236,250,${0.5 * (1 - age)})`; c.beginPath(); c.arc(px, py, pr, 0, TAU); c.fill();
    }
    c.save(); c.translate(0, bob);
    // locomotive (facing left)
    const lx = tx - u * 4.4, ly = ty - u * 0.55;
    c.fillStyle = '#c0283a'; rrectOn(c, lx, ly - u * 1.7, u * 3.4, u * 1.7, u * 0.2); c.fill();
    c.fillStyle = '#9a1c2c'; rrectOn(c, lx + u * 2.0, ly - u * 2.9, u * 1.4, u * 1.3, u * 0.15); c.fill();
    c.fillStyle = '#ffe9a8'; rrectOn(c, lx + u * 2.2, ly - u * 2.7, u * 1.0, u * 0.75, u * 0.1); c.fill();
    c.fillStyle = '#1b1d28'; c.fillRect(lx + u * 0.5, ly - u * 2.6, u * 0.5, u * 0.95);
    c.fillStyle = '#ffcc00'; c.fillRect(lx, ly - u * 0.45, u * 3.4, u * 0.12);
    // headlight beam
    const hl = c.createLinearGradient(lx, 0, lx - u * 5, 0); hl.addColorStop(0, 'rgba(255,240,180,0.45)'); hl.addColorStop(1, 'rgba(255,240,180,0)');
    c.fillStyle = hl; c.beginPath(); c.moveTo(lx, ly - u * 1.2); c.lineTo(lx - u * 5, ly - u * 2.2); c.lineTo(lx - u * 5, ly - u * 0.1); c.closePath(); c.fill();
    c.fillStyle = '#fff6c0'; c.beginPath(); c.arc(lx + u * 0.08, ly - u * 1.15, u * 0.2, 0, TAU); c.fill();
    // the driver in the cab window
    const keep = ctx; ctx = c;
    try { c.save(); c.beginPath(); c.rect(lx + u * 2.2, ly - u * 2.7, u * 1.0, u * 0.75); c.clip(); drawMascot(c, lx + u * 2.7, ly - u * 2.05, u * 0.24, t, 0); c.restore(); } catch (e) { /* ignore */ }
    // wagon full of flag balls
    const wx = tx - u * 0.6, wy = ty - u * 0.55, ww = u * 5.2, wh = u * 2.3;
    const pops = t > 1.9;
    if (!pops) [[7, 0.22], [9, 0.5], [10, 0.78]].forEach(([lv, f]) => drawRoundBlob(lv, wx + ww * f, wy - wh + u * 0.15, u * 0.62, 1, Math.max(1, u * 0.04), true));
    ctx = keep;
    const wg = c.createLinearGradient(0, wy - wh, 0, wy); wg.addColorStop(0, '#4d82e8'); wg.addColorStop(1, '#1d438f');
    c.fillStyle = wg; rrectOn(c, wx, wy - wh, ww, wh, u * 0.18); c.fill();
    c.fillStyle = '#ffd84d'; for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(wx + u * 0.3 + i * (ww - u * 0.6) / 8, wy - wh + u * 0.22, u * 0.06, 0, TAU); c.fill(); }
    c.fillStyle = '#ffcc00'; c.fillRect(wx, wy - u * 0.5, ww, u * 0.08);
    c.font = `800 ${u * 0.36}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffe27a';
    c.fillText('PIISPAN EXPRESS', wx + ww / 2, wy - wh * 0.45);
    // coupling
    c.fillStyle = '#26304d'; c.fillRect(lx + u * 3.4, ly - u * 0.5, wx - lx - u * 3.4, u * 0.14);
    c.restore();
    for (const x of [lx + u * 0.7, lx + u * 2.6, wx + u * 0.9, wx + u * 2.0, wx + ww - u * 2.0, wx + ww - u * 0.9]) wheel(x, ty - u * 0.38, u * 0.36, -dist * 2.2);
    // flag balls burst out of the wagon
    if (pops) {
      const keep2 = ctx; ctx = c;
      for (const b of balls) {
        const s2 = t - 1.9 - b.d; if (s2 < 0) continue;
        const vx = Math.cos(b.a) * u * 9 * b.sp, vy = Math.sin(b.a) * u * 13 * b.sp, x = wx + ww / 2 + vx * s2, y = wy - wh + vy * s2 + u * 9 * s2 * s2;
        drawRoundBlob(b.lv, x, y, u * (0.4 + b.lv * 0.025), 1, Math.max(1, u * 0.04), true);
      }
      ctx = keep2;
    }
    // title letters drop in one by one
    const word = 'PiispanPELI', fs = Math.min(W * 0.13, 88);
    c.font = `400 ${fs}px "Lilita One", ${FONT}`; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    const widths = [...word].map(ch => c.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
    let x = W / 2 - total / 2;
    [...word].forEach((ch, i) => {
      const p = back((t - 0.9 - i * 0.07) / 0.5), y = H * 0.33 - (1 - p) * H * 0.5;
      if (t > 0.9 + i * 0.07) {
        c.save(); c.translate(x + widths[i] / 2, y + (i % 2 ? 3 : -2)); c.rotate((i % 2 ? 4 : -3) * Math.PI / 180);
        c.lineJoin = 'round'; c.lineWidth = fs * 0.12; c.strokeStyle = '#050c26'; c.strokeText(ch, -widths[i] / 2, 0);
        c.fillStyle = TITLE_COLORS[i]; c.fillText(ch, -widths[i] / 2, 0); c.restore();
      }
      x += widths[i];
    });
    // tagline
    const ta = ease((t - 1.8) / 0.5);
    if (ta > 0) { c.globalAlpha = ta; c.font = `700 ${Math.min(W * 0.045, 22)}px ${FONT}`; c.textAlign = 'center'; c.fillStyle = '#dce6ff'; c.fillText(T('Euroopan junapeli'), W / 2, H * 0.33 + fs * 0.55); c.globalAlpha = 1; }
    if (t > 3.3) finish();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
function rrectOn(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function start(data) {
  data = data || {};
  best = Math.max(best, Number(data.best) || 0);
  bestLevel = Math.max(bestLevel, Number(data.bestLevel) || 0);
  layout(); syncSound();
  try { if (document.fonts) { document.fonts.load(`800 20px ${FONT}`); document.fonts.load('400 40px "Lilita One"').then(() => buildBg()).catch(() => {}); } } catch (e) { /* ignore */ }
  const g = data.game;
  if (validSave(g) && g.blobs.length) {
    loadGame(g, false);
  } else {
    preloadMenu(); showMenu();
  }
  syncUI();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  playIntro();
}

if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
