<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PiispanPELI</title>
<meta name="description" content="Ammu Euroopan lippupalloja purkkiin ja yhdistä samat maat isommiksi.">
<meta name="theme-color" content="#0a1c47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PiispanPELI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen, a glass jar of European flag balls; HUD in bands on phones, side panels on wide screens */
  --night:#0a1c47;
  --dusk:#123072;
  --paper:#fbf6ea;
  --ink:#0f2350;
  --berry:#e8b400;
  --gold:#ffcc00;
  --lilac:#a9c1f0;
  --display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --body:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.iconbtn{position:fixed;z-index:5;width:40px;height:40px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--paper);cursor:pointer;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.iconbtn svg{width:20px;height:20px;display:block}
.iconbtn[hidden]{display:none}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(14,12,38,.5)}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none;z-index:-1}
#overlay[hidden]{display:none}
.abil{position:fixed;z-index:5;height:34px;padding:0 12px;border:2px solid #ffd84d;border-radius:12px;font:800 13px/1 var(--body);color:#fff;cursor:pointer;letter-spacing:.02em;
  background:linear-gradient(90deg,#e8a800 0,#ffcc00 var(--p,0%),rgba(10,28,71,.85) var(--p,0%),rgba(10,28,71,.85) 100%);
  box-shadow:0 0 0 2px #0a1c47,0 0 14px rgba(255,204,0,.35),inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #6b5000;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;font-variant-numeric:tabular-nums}
.abil.ready{color:var(--ink);text-shadow:none;box-shadow:0 0 0 2px #0a1c47,0 0 22px rgba(255,204,0,.8),inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 #6b5000}
.abil[hidden]{display:none}
.abil.ready{animation:abilpulse 1s ease-in-out infinite}
.abil:disabled{cursor:default;color:rgba(255,255,255,.85)}
.abil:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
@keyframes abilpulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){.abil.ready{animation:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:15;pointer-events:none}
.card{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:28px;padding:24px 24px 22px;text-align:center;box-shadow:0 26px 70px rgba(4,2,24,.55)}
.title{font-family:var(--display);font-weight:400;font-size:min(52px,11.5vw);line-height:1.05;margin:0 0 6px;letter-spacing:1px;white-space:nowrap}
.title span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.lead{font-size:18px;line-height:1.35;font-weight:600;margin:2px auto 16px;max-width:30ch;text-wrap:balance}
.rules{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px;text-align:left;font-size:16px;line-height:1.3;font-weight:500}
.rules li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;margin-top:1px;box-shadow:inset -3px -4px 0 rgba(35,29,69,.18),inset 3px 3px 0 rgba(255,255,255,.45)}
.btn{font:800 22px/1 var(--body);border:0;border-radius:999px;padding:14px 40px 11px;background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #b58f00;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b58f00}
.btn:focus-visible{outline:3px solid #6f63ff;outline-offset:4px}
.btn.alt{background:#e3eafa;color:var(--ink);box-shadow:0 5px 0 #b9c7e8;font-size:18px;padding:12px 26px 9px}
.btn.alt:active{box-shadow:0 1px 0 #b9c7e8}
.saves{margin:18px 0 0;text-align:left}
.saves h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5d6b8c;margin:0 0 8px;font-weight:700}
.saves ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.saves li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(15,35,80,.06);border-radius:14px;padding:8px 10px 8px 12px;font-size:14px}
.slotname{font-weight:700}
.slotinfo{grid-column:1;font-size:13px;color:#4c5a7c}
.slotbtns{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px}
.muted{opacity:.6}
.mini{font:700 14px/1 var(--body);border:0;border-radius:999px;padding:9px 13px 7px;background:var(--ink);color:#fff;cursor:pointer}
.mini.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(15,35,80,.3)}
.mini:focus-visible{outline:3px solid #6f8dff;outline-offset:2px}
.note{font-size:14px;font-weight:600;color:#1f7a3a;margin:0 0 10px}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.keys{font-size:13px;color:#6c6590;margin:16px 0 0;font-weight:500}
.mascot{display:block;width:96px;height:96px;margin:-8px auto -4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.audio{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;text-align:left;font-size:14px;font-weight:700;background:rgba(15,35,80,.06);border-radius:14px;padding:10px 12px}
.audio select{font:600 15px var(--body);color:var(--ink);background:#fff;border:1.5px solid rgba(15,35,80,.25);border-radius:10px;padding:6px 8px;min-width:0}
.audio input[type=range]{width:100%;accent-color:#e8b400}
.audio select:focus-visible,.audio input:focus-visible{outline:3px solid #6f8dff;outline-offset:2px}
.install{margin-top:16px}
.install:empty{display:none}
.hint{font-size:14px;line-height:1.35;color:#6c6590;margin:0;font-weight:500}
.h2{font-family:var(--display);font-weight:400;font-size:min(46px,11vw);line-height:1.05;margin:0 0 6px;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-wrap:balance}
.final{font-size:68px;font-weight:800;line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.sub{margin:6px 0 14px;font-size:17px;font-weight:600;color:#6c6590}
.sub.win{color:#c58f00}
.biggest{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 22px;font-size:16px;font-weight:600}
@media (hover: none) and (pointer: coarse){.keys{display:none}}
@media (prefers-reduced-motion: reduce){.btn,.iconbtn{transition:none}}
</style>

<body>
<div id="safe" aria-hidden="true"></div>
<canvas id="game" aria-label="Pelialue: purkki täynnä lippupalloja"></canvas>
<button class="iconbtn" id="soundBtn" type="button" aria-label="Mykistä äänet"></button>
<button class="iconbtn" id="pauseBtn" type="button" aria-label="Tauko" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="abil" id="abilBtn" type="button" hidden>Heilauta</button>
<div id="overlay"><div class="card" id="card" role="dialog" aria-modal="true" aria-label="PiispanPELI"></div></div>
<script>
'use strict';
(function () {
// <engine>
// ---- Soft-body engine: every blob is a ring of small beads held together by
// ---- skin (edge length), pressure (area) and a soft shape-matching spring.
const WORLD_W = 12, FLOOR_Y = 19.2, DANGER_Y = 2.75, LX = 6, LY = 1.1;
const GRAV = 24, RB = 0.11, SPACING = 0.165;
const RADII = [0.40, 0.47, 0.54, 0.63, 0.74, 0.86, 1.00, 1.17, 1.36, 1.59, 1.85, 2.16, 2.51, 2.93, 3.40];
const MAXL = RADII.length - 1;
const STEP = 1 / 60, SUB = 8, H = STEP / SUB;
const KE = 0.9, KA = 0.25, KS = 0.003, SLACK = 0.9;
const INT_DAMP = 0.997, GLOB_DAMP = 0.99995, VMAX = 60;
const ANG_KEEP = 0.9995, REST_V = 0.02, REST_DAMP = 0.995, MASS_EXP = -0.5;
const MU = 0.03, WALL_MU = 0.1, FLOOR_MU = 0.1, GROW_T = 0.32;
const MAXN = 9000;
const X = new Float64Array(MAXN), Y = new Float64Array(MAXN);
const PX = new Float64Array(MAXN), PY = new Float64Array(MAXN);
const VX = new Float64Array(MAXN), VY = new Float64Array(MAXN);
const IW = new Float64Array(MAXN), OWN = new Int32Array(MAXN);
const TGX = new Float64Array(512), TGY = new Float64Array(512);
const CELL = 0.25, GX0 = -1.5, GY0 = -12;
const GW = Math.ceil((WORLD_W + 3) / CELL), GH = Math.ceil((FLOOR_Y + 14) / CELL), GN = GW * GH;
const cellStart = new Int32Array(GN + 1), cellCur = new Int32Array(GN);
const cellItems = new Int32Array(MAXN), beadCell = new Int32Array(MAXN);
const CD = 2 * RB, CD2 = CD * CD;
const E = { blobs: [], NB: 0, mergeQ: [], events: [], idc: 0 };

function easeOutBack(u) { const c1 = 2.2, c3 = c1 + 1, t = u - 1; return 1 + c3 * t * t * t + c1 * t * t; }

function makeBlob(level, cx, cy, vx, vy, s0) {
  const R = RADII[level], Rr = R - RB;
  const n = Math.max(10, Math.round(2 * Math.PI * Rr / SPACING));
  if (E.NB + n > MAXN) return null;
  const sc = s0 == null ? 1 : s0;
  const b = {
    id: ++E.idc, level, R, Rr, n, start: E.NB, index: E.blobs.length,
    rest: 2 * Rr * Math.sin(Math.PI / n), area0: 0.5 * n * Rr * Rr * Math.sin(2 * Math.PI / n),
    rx: new Float64Array(n), ry: new Float64Array(n),
    // big balls keep their shape better so they don't droop
    slack: SLACK + (1 - SLACK) * 0.8 * level / MAXL, ks: KS * (1 + 2.5 * level / MAXL),
    s0: sc, scale: sc, gt: sc < 1 ? 0 : GROW_T, age: 0, alive: true, merging: false, touched: false,
    cx, cy, vx, vy, ang: 0, top: cy - R, spd: 0, blink: 1 + Math.random() * 4, blinkT: 0
  };
  const w = 1 / Math.pow(Rr, MASS_EXP);
  for (let k = 0; k < n; k++) {
    const th = 2 * Math.PI * k / n, c = Math.cos(th), s = Math.sin(th);
    b.rx[k] = c; b.ry[k] = s;
    const i = E.NB + k;
    X[i] = cx + c * Rr * sc; Y[i] = cy + s * Rr * sc; PX[i] = X[i]; PY[i] = Y[i];
    VX[i] = vx; VY[i] = vy; IW[i] = w; OWN[i] = b.index;
  }
  E.NB += n; E.blobs.push(b);
  return b;
}

function clearAll() { E.blobs = []; E.NB = 0; E.mergeQ.length = 0; E.events.length = 0; }

function solveBlob(b) {
  const s = b.start, n = b.n, e = s + n, sc = b.scale;
  // skin: keep neighbouring beads at their rest distance
  const L0 = b.rest * sc;
  for (let k = 0; k < n; k++) {
    const i = s + k, j = k + 1 < n ? i + 1 : s;
    const dx = X[j] - X[i], dy = Y[j] - Y[i];
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-9) continue;
    const c = 0.5 * KE * (d - L0) / d;
    X[i] += dx * c; Y[i] += dy * c; X[j] -= dx * c; Y[j] -= dy * c;
  }
  // pressure: keep the enclosed area
  let A = 0;
  for (let k = 0; k < n; k++) { const i = s + k, j = k + 1 < n ? i + 1 : s; A += X[i] * Y[j] - X[j] * Y[i]; }
  A *= 0.5;
  const C = A - b.area0 * b.slack * sc * sc;
  let sg = 0;
  for (let k = 0; k < n; k++) {
    const ip = k + 1 < n ? s + k + 1 : s, im = k > 0 ? s + k - 1 : e - 1;
    const gx = 0.5 * (Y[ip] - Y[im]), gy = 0.5 * (X[im] - X[ip]);
    TGX[k] = gx; TGY[k] = gy; sg += gx * gx + gy * gy;
  }
  if (sg > 1e-12) {
    let lam = -KA * C / sg;
    const lim = 0.04 / Math.sqrt(sg / n);
    if (lam > lim) lam = lim; else if (lam < -lim) lam = -lim;
    for (let k = 0; k < n; k++) { X[s + k] += lam * TGX[k]; Y[s + k] += lam * TGY[k]; }
  }
  // jelly: gently pull towards the rotated rest circle
  let cx = 0, cy = 0;
  for (let i = s; i < e; i++) { cx += X[i]; cy += Y[i]; }
  cx /= n; cy /= n;
  let sa = 0, ca = 0;
  for (let k = 0; k < n; k++) {
    const dx = X[s + k] - cx, dy = Y[s + k] - cy;
    sa += b.rx[k] * dy - b.ry[k] * dx; ca += b.rx[k] * dx + b.ry[k] * dy;
  }
  const m = Math.sqrt(sa * sa + ca * ca);
  if (m > 1e-9) {
    sa /= m; ca /= m;
    const r = b.Rr * sc;
    for (let k = 0; k < n; k++) {
      const gx = cx + r * (ca * b.rx[k] - sa * b.ry[k]), gy = cy + r * (sa * b.rx[k] + ca * b.ry[k]);
      X[s + k] += (gx - X[s + k]) * b.ks; Y[s + k] += (gy - Y[s + k]) * b.ks;
    }
  }
}

function buildGrid() {
  const nb = E.NB;
  cellStart.fill(0);
  for (let i = 0; i < nb; i++) {
    let cx = ((X[i] - GX0) / CELL) | 0, cy = ((Y[i] - GY0) / CELL) | 0;
    if (cx < 0) cx = 0; else if (cx >= GW) cx = GW - 1;
    if (cy < 0) cy = 0; else if (cy >= GH) cy = GH - 1;
    const c = cy * GW + cx;
    beadCell[i] = c; cellStart[c + 1]++;
  }
  for (let c = 0; c < GN; c++) { cellStart[c + 1] += cellStart[c]; cellCur[c] = cellStart[c]; }
  for (let i = 0; i < nb; i++) cellItems[cellCur[beadCell[i]]++] = i;
}

function collide() {
  const nb = E.NB, bl = E.blobs;
  for (let i = 0; i < nb; i++) {
    const c = beadCell[i], gx = c % GW, gy = (c / GW) | 0, oi = OWN[i];
    const x0 = gx > 0 ? gx - 1 : 0, x1 = gx < GW - 1 ? gx + 1 : gx;
    const y0 = gy > 0 ? gy - 1 : 0, y1 = gy < GH - 1 ? gy + 1 : gy;
    for (let yy = y0; yy <= y1; yy++) {
      for (let xx = x0; xx <= x1; xx++) {
        const cc = yy * GW + xx, ce = cellStart[cc + 1];
        for (let k = cellStart[cc]; k < ce; k++) {
          const j = cellItems[k];
          if (j <= i) continue;
          const oj = OWN[j];
          if (oj === oi) continue;
          let dx = X[j] - X[i], dy = Y[j] - Y[i];
          const d2 = dx * dx + dy * dy;
          if (d2 >= CD2) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-6) { dx = 1e-3; dy = 0; d = 1e-3; }
          const nx = dx / d, ny = dy / d, pen = CD - d;
          const wi = IW[i], wj = IW[j], ws = wi + wj, corr = pen / ws;
          X[i] -= nx * corr * wi; Y[i] -= ny * corr * wi;
          X[j] += nx * corr * wj; Y[j] += ny * corr * wj;
          // friction: cancel part of the sliding motion (Coulomb-like)
          const rx = (X[j] - PX[j]) - (X[i] - PX[i]), ry = (Y[j] - PY[j]) - (Y[i] - PY[i]);
          const rn = rx * nx + ry * ny, tx = rx - rn * nx, ty = ry - rn * ny;
          const tl = Math.sqrt(tx * tx + ty * ty);
          if (tl > 1e-9) {
            const f = Math.min(1, MU * pen / tl) / ws;
            X[i] += tx * f * wi; Y[i] += ty * f * wi; X[j] -= tx * f * wj; Y[j] -= ty * f * wj;
          }
          const A = bl[oi], B = bl[oj];
          A.touched = true; B.touched = true;
          if (A.level === B.level && !A.merging && !B.merging) {
            A.merging = true; B.merging = true; E.mergeQ.push(A, B);
          }
        }
      }
    }
  }
}

// the wagon's mouth widens like a funnel above FUN_Y
const FUN_Y = 3.4, FUN_W = 1.0, FUN_TOP = -0.3;
function funnelAt(y) { return y >= FUN_Y ? 0 : Math.min(1, (FUN_Y - y) / (FUN_Y - FUN_TOP)) * FUN_W; }
function walls() {
  const nb = E.NB, ymax = FLOOR_Y - RB;
  for (let i = 0; i < nb; i++) {
    const fw = funnelAt(Y[i]), xmin = RB - fw, xmax = WORLD_W - RB + fw;
    if (X[i] < xmin || X[i] > xmax) {
      const pen = X[i] < xmin ? xmin - X[i] : X[i] - xmax;
      X[i] = X[i] < xmin ? xmin : xmax;
      const dy = Y[i] - PY[i], f = Math.min(Math.abs(dy), WALL_MU * pen);
      Y[i] -= dy > 0 ? f : -f;
    }
    if (Y[i] > ymax) {
      const pen = Y[i] - ymax;
      Y[i] = ymax;
      const dx = X[i] - PX[i], f = Math.min(Math.abs(dx), FLOOR_MU * pen);
      X[i] -= dx > 0 ? f : -f;
      E.blobs[OWN[i]].touched = true;
    }
  }
}


// push any bead that ended up inside another blob back out through the nearest skin edge
const BBX0 = [], BBX1 = [], BBY0 = [], BBY1 = [];
function unpenetrate() {
  const bl = E.blobs, nbl = bl.length;
  for (let q = 0; q < nbl; q++) {
    const b = bl[q], s = b.start, e = s + b.n;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let i = s; i < e; i++) { const x = X[i], y = Y[i]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    BBX0[q] = x0; BBX1[q] = x1; BBY0[q] = y0; BBY1[q] = y1;
  }
  for (let qa = 0; qa < nbl; qa++) {
    const A = bl[qa], as = A.start, an = A.n;
    for (let qb = 0; qb < nbl; qb++) {
      if (qb === qa || BBX0[qb] > BBX1[qa] || BBX1[qb] < BBX0[qa] || BBY0[qb] > BBY1[qa] || BBY1[qb] < BBY0[qa]) continue;
      const B = bl[qb], be = B.start + B.n;
      for (let j = B.start; j < be; j++) {
        const px = X[j], py = Y[j];
        if (px < BBX0[qa] || px > BBX1[qa] || py < BBY0[qa] || py > BBY1[qa]) continue;
        let inside = false;
        for (let k = 0, m = an - 1; k < an; m = k++) {
          const yi = Y[as + k], yj = Y[as + m];
          if ((yi > py) !== (yj > py) && px < (X[as + m] - X[as + k]) * (py - yi) / (yj - yi) + X[as + k]) inside = !inside;
        }
        if (!inside) continue;
        let best = 1e9, bx = 0, by = 0, bnx = 0, bny = 0, bk = 0;
        for (let k = 0; k < an; k++) {
          const i1 = as + k, i2 = as + (k + 1 < an ? k + 1 : 0);
          const ex = X[i2] - X[i1], ey = Y[i2] - Y[i1], l2 = ex * ex + ey * ey || 1e-9;
          let t = ((px - X[i1]) * ex + (py - Y[i1]) * ey) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = X[i1] + ex * t, qy = Y[i1] + ey * t, d2 = (px - qx) * (px - qx) + (py - qy) * (py - qy);
          if (d2 < best) { const l = Math.sqrt(l2); best = d2; bx = qx; by = qy; bnx = ey / l; bny = -ex / l; bk = k; }

// ------------------------------ layout ------------------------------
let vw = 0, vh = 0, dpr = 1, SC = 40, OX = 0, OY = 0, mode = 'top';
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');

const safeEl = document.getElementById('safe');
function layout() {
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(vw * dpr)); canvas.height = Math.max(1, Math.round(vh * dpr));
  // keep clear of the notch, status bar and home indicator when running as an installed app
  const ps = getComputedStyle(safeEl);
  const iT = parseFloat(ps.paddingTop) || 0, iR = parseFloat(ps.paddingRight) || 0;
  const iB = parseFloat(ps.paddingBottom) || 0, iL = parseFloat(ps.paddingLeft) || 0;
  const aw = Math.max(1, vw - iL - iR), ah = Math.max(1, vh - iT - iB);
  const ww = VX1 - VX0, wh = VY1 - VY0;
  const sTop = Math.min((aw - 24) / ww, (ah - 156) / wh);
  const sSide = Math.min((aw - 400) / ww, (ah - 32) / wh);
  if (sSide > sTop * 1.08) {
    mode = 'side'; SC = sSide;
    OX = iL + (aw - ww * SC) / 2 - VX0 * SC;
    OY = iT + (ah - wh * SC) / 2 - VY0 * SC;
  } else {
    mode = 'top'; SC = Math.max(8, sTop);
    OX = iL + (aw - ww * SC) / 2 - VX0 * SC;
    OY = iT + Math.max(0, (ah - (wh * SC + 156)) / 2) + 88 - VY0 * SC;
  }
  placeButtons(); buildBg();
}

function placeButtons() {
  const fr = OX + VX1 * SC, ft = OY + VY0 * SC;
  const fl = OX + VX0 * SC, fb = OY + VY1 * SC;
  if (mode === 'top') {
    pauseBtn.style.left = (fr - 44) + 'px'; soundBtn.style.left = (fr - 92) + 'px';
    pauseBtn.style.top = soundBtn.style.top = (ft - 74) + 'px';
    abilBtn.style.left = (fl + 4) + 'px'; abilBtn.style.top = (fb + 14) + 'px'; abilBtn.style.right = 'auto';
  } else {
    soundBtn.style.left = (fr + 24) + 'px'; pauseBtn.style.left = (fr + 72) + 'px';
    pauseBtn.style.top = soundBtn.style.top = (ft + 4) + 'px';
    abilBtn.style.left = 'auto'; abilBtn.style.right = (vw - fl + 30) + 'px'; abilBtn.style.top = (ft + 290) + 'px';
  }
}

function buildBg() {
  bg.width = canvas.width; bg.height = canvas.height;
  bgx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = bgx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, '#163a8a'); g.addColorStop(1, '#081739');
  bgx.fillStyle = g; bgx.fillRect(0, 0, vw, vh);
  const R = Math.max(vw, vh) * 0.5;
  [[0.15, 0.15, 8], [0.88, 0.85, 3]].forEach(([fx, fy, l]) => {
    const c = PAL[l].rgb, x = fx * vw, y = fy * vh, rg = bgx.createRadialGradient(x, y, 0, x, y, R);
    rg.addColorStop(0, css(c, 0.1)); rg.addColorStop(1, css(c, 0));
    bgx.fillStyle = rg; bgx.fillRect(0, 0, vw, vh);
  });
  // big red-black PIISPAN / PELI behind the wagon
  bgx.save();
  bgx.translate(vw / 2, vh * 0.5); bgx.rotate(-0.08);
  const f1 = Math.min(vw / 4.4, vh * 0.2), f2 = f1 * 1.15;
  bgx.textAlign = 'center'; bgx.textBaseline = 'middle'; bgx.lineJoin = 'round';
  bgx.font = `400 ${f1}px "Lilita One", "Baloo 2", sans-serif`;
  bgx.globalAlpha = 0.55;
  bgx.fillStyle = '#000'; bgx.fillText('PIISPAN', f1 * 0.05, -f1 * 0.55 + f1 * 0.06);
  bgx.lineWidth = f1 * 0.08; bgx.strokeStyle = '#000'; bgx.strokeText('PIISPAN', 0, -f1 * 0.55);
  bgx.fillStyle = '#e01e37'; bgx.fillText('PIISPAN', 0, -f1 * 0.55);
  bgx.font = `400 ${f2}px "Lilita One", "Baloo 2", sans-serif`;
  bgx.fillStyle = '#e01e37'; bgx.fillText('PELI', f2 * 0.05, f2 * 0.45 + f2 * 0.06);
  bgx.lineWidth = f2 * 0.08; bgx.strokeStyle = '#e01e37'; bgx.strokeText('PELI', 0, f2 * 0.45);
  bgx.fillStyle = '#0b0b0b'; bgx.fillText('PELI', 0, f2 * 0.45);
  bgx.restore();
  // a ring of twelve gold stars behind the jar
  const scx = OX + WORLD_W / 2 * SC, scy = OY + (FLOOR_Y * 0.5) * SC, sr2 = Math.min(vw, vh) * 0.46;
  bgx.fillStyle = 'rgba(255,204,0,0.13)';
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * TAU, x = scx + Math.cos(a) * sr2, y = scy + Math.sin(a) * sr2, s = Math.max(10, sr2 * 0.07);

  bgx.restore();

// ------------------------------ game flow ------------------------------
function randLevel() {
  let r = Math.random() * SPAWN_W.reduce((a, b) => a + b, 0);
  for (let i = 0; i < SPAWN_W.length; i++) { r -= SPAWN_W[i]; if (r <= 0) return i; }
  return 0;
}

function syncUI() {
  pauseBtn.hidden = !(state === 'play' || state === 'paused');
  syncAbil();
  canvas.style.cursor = state === 'play' ? 'crosshair' : 'default';
}

function startGame() {
  if (state === 'play') return;
  sfx.ensure();
  clearAll(); parts.length = 0; floaters.length = 0;
  bonuses.length = 0; bonusT = 12; jamT = 0;
  score = 0; shownScore = 0; maxLevel = 0; dangerT = 0; combo = 0; comboT = 0; shake = 0; blockedT = 0; charges = 0; abilProg = 0; wobT = 0;
  cur = Math.random() < 0.5 ? 0 : 1; nxt = randLevel(); cooldown = 0.2; popT = 0; aiming = false;
  state = 'play'; hideOverlay(); syncUI();
}

function pause() { if (state !== 'play') return; state = 'paused'; aiming = false; autoSave(); showPause(); syncUI(); }

// ---- saving: an automatic save plus three save slots ----
const AUTO_KEY = 'piispanpeli-autosave', SLOT_KEY = i => 'piispanpeli-slot' + i;
let autoT = 0;
function gameData() {
  return { v: 1, t: Date.now(), score, cur, nxt, maxLevel, charges, abilProg,
    blobs: E.blobs.map(b => [b.level, Math.round(b.cx * 100) / 100, Math.round(b.cy * 100) / 100]) };
}
function validSave(g) { return !!(g && Array.isArray(g.blobs)); }
function autoSave() { if (state === 'play' || state === 'paused') store.set(AUTO_KEY, gameData()); }
function loadGame(g, play) {
  clearAll(); parts.length = 0; floaters.length = 0;
  for (const item of g.blobs) {
    const lv = item[0] | 0;
    if (lv < 0 || lv > MAXL) continue;
    const R = RADII[lv];
    makeBlob(lv, clamp(+item[1] || 5, R, WORLD_W - R), clamp(+item[2] || 10, DANGER_Y, FLOOR_Y - R), 0, 0, 0.85);
  }
  score = shownScore = g.score | 0; cur = clamp(g.cur | 0, 0, 4); nxt = clamp(g.nxt | 0, 0, 4); maxLevel = g.maxLevel | 0;
  charges = g.charges | 0; abilProg = g.abilProg | 0; wobT = 0;
  dangerT = 0; combo = 0; comboT = 0; shake = 0; blockedT = 0; cooldown = 0.3; popT = 0; aiming = false; autoT = 0;
  sfx.ensure();
  if (play) { state = 'play'; hideOverlay(); } else { state = 'paused'; showPause(); }
  syncUI();
}
function fmtDate(t) {
  const d = new Date(t), two = n => String(n).padStart(2, '0');
  return `${d.getDate()}.${d.getMonth() + 1}. klo ${two(d.getHours())}.${two(d.getMinutes())}`;
}
function slotsHTML(mode) {
  let rows = '', any = false;
  for (let i = 1; i <= 3; i++) {
    const s = store.get(SLOT_KEY(i), null), ok = validSave(s);
    if (ok) any = true;
    const info = ok ? `${s.score} pistettä · ${fmtDate(s.t)}` : '<span class="muted">tyhjä</span>';
    let btns = '';
    if (mode === 'save') btns = `<button class="mini" type="button" data-act="save" data-slot="${i}">Tallenna</button>`;
    else if (ok) btns = `<button class="mini" type="button" data-act="load" data-slot="${i}">Lataa</button><button class="mini ghost" type="button" data-act="del" data-slot="${i}" aria-label="Poista tallennus ${i}">Poista</button>`;
    rows += `<li><span class="slotname">Tallennus ${i}</span><span class="slotbtns">${btns}</span><span class="slotinfo">${info}</span></li>`;
  }
  if (mode !== 'save' && !any) return '';
  return `<div class="saves"><h3>${mode === 'save' ? 'Valitse tallennuspaikka' : 'Tallennetut pelit'}</h3><ul>${rows}</ul></div>`;
}
function toMenu() {
  autoSave();
  state = 'menu'; preloadMenu(); showMenu(); syncUI();
}
function resume() { if (state !== 'paused') return; state = 'play'; hideOverlay(); syncUI(); }

let jamT = 0;
function gameOver() {
  if (invincible) { dangerT = 0; jamT = 0; return; }
  state = 'over'; aiming = false;
  const newBest = score > best;
  if (newBest) { best = score; store.set('piispanpeli-best', best); }
  store.set(AUTO_KEY, null);
  if (maxLevel > bestLevel) { bestLevel = maxLevel; store.set('piispanpeli-level', bestLevel); }
  sfx.over(); if (!reduceMotion) shake = Math.max(shake, 0.25);
  syncUI();
  setTimeout(() => { if (state === 'over') showOver(newBest); }, 1000);
}

function shoot() {
  if (state !== 'play' || cooldown > 0) return;
  const R = RADII[cur], lim = (R + RB) * (R + RB);
  for (let i = 0; i < E.NB; i++) {
    const dx = X[i] - LX, dy = Y[i] - LY;
    if (dx * dx + dy * dy < lim) { blockedT = 0.9; sfx.blocked(); return; }
  }
  const sp = 3 + aimPow * 29;
  const b = makeBlob(cur, LX, LY, Math.sin(aimAng) * sp, Math.cos(aimAng) * sp, 1);
  if (!b) return;

// ------------------------------ effects ------------------------------
function burst(x, y, level, count, R) {
  if (reduceMotion) count = Math.ceil(count / 3);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, sp = rand(2.5, 7) * (0.7 + R * 0.25), life = rand(0.45, 0.8);
    parts.push({ k: 0, x: x + Math.cos(a) * R * 0.6, y: y + Math.sin(a) * R * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      r: rand(0.06, 0.15) * (0.8 + R * 0.2), life, max: life, c: PAL[level].light });
  }
}
function ring(x, y, R, level) { parts.push({ k: 1, x, y, r: R * 0.7, r1: R * 1.55, life: 0.35, max: 0.35, c: PAL[level].light }); }
function floater(text, x, y, color, size) { floaters.push({ text, x, y, life: 1.1, max: 1.1, color, size }); }

function handleEvent(ev) {
  if (ev.type === 'merge') {
    const R = RADII[ev.level];
    burst(ev.x, ev.y, ev.level, 8 + ev.level * 2, R); ring(ev.x, ev.y, R, ev.level);
    if (ev.level >= 4) mascotBounce = 1;
    sfx.merge(ev.level);
    if (ev.level >= 7 && !reduceMotion) shake = Math.max(shake, 0.1 + (ev.level - 7) * 0.06);
    if (state !== 'play') return;
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
    const pts = POINTS[ev.level] * combo;
    addScore(pts);
    floater('+' + pts, ev.x, ev.y, PAL[ev.level].light, 17 + ev.level * 1.5);
    if (combo >= 2) floater('Kombo ×' + combo, ev.x, ev.y - R - 0.5, '#fff7ee', 19);
    else if (ev.level >= 2) floater(NAMES[ev.level], ev.x, ev.y - R - 0.5, '#ffe066', 16 + ev.level);
    if (ev.level > maxLevel) {
      if (ev.level >= 5 && ev.level > bestLevel) floater('Uusi maa: ' + NAMES[ev.level] + '!', ev.x, ev.y - R - 1.1, '#ffe066', 22);
      maxLevel = ev.level;
    }
  } else if (ev.type === 'max') {
    for (let l = 0; l <= MAXL; l++) burst(ev.x, ev.y, l, 5, 2.5);
    ring(ev.x, ev.y, 3.2, MAXL); sfx.mega();
    if (!reduceMotion) shake = 0.45;
    if (state !== 'play') return;
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
    const pts = MAX_BONUS * combo;
    addScore(pts);
    floater('Eurooppa yhdistyi! +' + pts, ev.x, ev.y, '#ffe066', 28);
  }
}

function addScore(p) {
  score += p; abilProg += p;
  while (abilProg >= ABIL_COST) { abilProg -= ABIL_COST; charges++; floater('Heilautus valmis!', WORLD_W / 2, 6, '#ffcc00', 24); }
  syncAbil();
}
function syncAbil() {
  const on = state === 'play' || state === 'paused';
  abilBtn.hidden = !on;
  if (!on) return;
  abilBtn.disabled = charges <= 0 || wobT > 0;
  abilBtn.classList.toggle('ready', charges > 0 && wobT <= 0);
  const fmt = n => n >= 1000 ? (Math.floor(n / 100) / 10).toString().replace(/\.0$/, '') + 'k' : String(Math.floor(n));
  abilBtn.textContent = charges > 0 ? `Heilauta! ×${charges}` : `Heilautus ${fmt(abilProg)} / ${fmt(ABIL_COST)}`;
  abilBtn.style.setProperty('--p', charges > 0 ? '100%' : (abilProg / ABIL_COST * 100).toFixed(1) + '%');
  abilBtn.setAttribute('aria-label', charges > 0 ? `Heilauta vaunua, ${charges} käytettävissä` : `Heilautus latautuu, ${Math.floor(abilProg)} / ${ABIL_COST} pistettä`);
}
function useAbility() {
  if (state !== 'play' || charges <= 0 || wobT > 0) return;
  charges--; wobT = 1.4;
  // throw everything up a bit, then rock the wagon from side to side
  for (const b of E.blobs) {
    const kick = 6 + Math.random() * 6, side = (Math.random() - 0.5) * 6;
    for (let i = b.start; i < b.start + b.n; i++) { VY[i] -= kick; VX[i] += side; }
  }
  if (!reduceMotion) shake = Math.max(shake, 0.35);
  sfx.mega(); mascotBounce = 1; dangerT = 0;
  floater('HEILAUTUS!', WORLD_W / 2, 7, '#ffcc00', 30);
  syncAbil();
}
function wobbleStep() {
  if (wobT <= 0) return;
  wobT -= STEP;
  const a = Math.sin((1.4 - wobT) * TAU * 2.2) * 55 * Math.min(1, wobT / 0.4) * STEP;
  for (let i = 0; i < E.NB; i++) VX[i] += a;
  if (wobT <= 0) { wobT = 0; syncAbil(); }
}

// two buttons on the wagon walls: game over when balls press both all the way at once
function checkDanger() {
  // how hard each button is pressed = how many bead contacts lean on it
  const y0 = BTN_Y - BTN_H / 2 - RB, y1 = BTN_Y + BTN_H / 2 + RB, lim = RB + 0.15;
  let cl = 0, cr = 0;
  for (let i = 0; i < E.NB; i++) {
    const y = Y[i];
    if (y < y0 || y > y1) continue;
    if (X[i] < lim) cl++; else if (X[i] > WORLD_W - lim) cr++;
  }
  tgtL = cl > 0 ? 1 : 0; tgtR = cr > 0 ? 1 : 0;
  btnL = cl > 0; btnR = cr > 0;
  if (btnL && btnR && wobT <= 0) { dangerT += STEP; if (dangerT >= DANGER_TIME) gameOver(); }
  else dangerT = Math.max(0, dangerT - STEP * 2);
}

function attract() {
  menuT -= STEP;
  if (menuT > 0) return;
  menuT = 1.1;
  if (E.blobs.length >= 24) return;
  for (const b of E.blobs) if (b.top < 6) return;
  const lv = Math.floor(Math.random() * 6), R = RADII[lv];
  makeBlob(lv, rand(R + 0.3, WORLD_W - R - 0.3), -1.5, rand(-1.5, 1.5), 2, 1);
}

function preloadMenu() {
  clearAll();
  const placed = [];
  let tries = 0;
  while (placed.length < 13 && tries < 500) {
    tries++;
    const lv = Math.floor(Math.random() * 7), R = RADII[lv];
    const x = rand(R + 0.1, WORLD_W - R - 0.1), y = rand(6 + R, FLOOR_Y - R - 0.05);
    if (placed.some(p => Math.hypot(p.x - x, p.y - y) < p.R + R + 0.15)) continue;
    placed.push({ x, y, R });
    makeBlob(lv, x, y, 0, 0, 1);
  }
  for (let i = 0; i < 90; i++) stepPhysics();
  E.events.length = 0;
}

function stepGame() {
  if (state === 'play') {
    if (keys.ArrowLeft || keys.KeyA) aimAng = Math.max(-1.3, aimAng - 1.5 * STEP);
    if (keys.ArrowRight || keys.KeyD) aimAng = Math.min(1.3, aimAng + 1.5 * STEP);
    if (keys.ArrowUp || keys.KeyW) aimPow = Math.min(1, aimPow + 0.8 * STEP);
    if (keys.ArrowDown || keys.KeyS) aimPow = Math.max(0.03, aimPow - 0.8 * STEP);
    if (cooldown > 0) cooldown = Math.max(0, cooldown - STEP);
    autoT += STEP;
    if (autoT > 4) { autoT = 0; autoSave(); }
  } else if (state === 'menu') attract();
  stepPhysics();
  for (let i = 0; i < E.events.length; i++) handleEvent(E.events[i]);
  E.events.length = 0;
  if (state === 'play') {
    wobbleStep(); checkDanger(); bonusStep();
    // launcher jammed: is there room for the waiting ball?
    const R = RADII[cur], lim = (R + RB) * (R + RB);
    let jam = false;
    for (let i = 0; i < E.NB; i++) { const dx = X[i] - LX, dy = Y[i] - LY; if (dx * dx + dy * dy < lim) { jam = true; break; } }
    if (jam) { jamT += STEP; if (jamT > 4) gameOver(); } else jamT = 0;
  }
  if (comboT > 0) { comboT -= STEP; if (comboT <= 0) combo = 0; }
}

function updateFx(dt) {
  depL += (tgtL - depL) * Math.min(1, dt * 14); depR += (tgtR - depR) * Math.min(1, dt * 14);
  updateNelli(dt);
  mascotBounce = Math.max(0, mascotBounce - dt * 3);
  time += dt; popT += dt;
  if (blockedT > 0) blockedT -= dt;
  shownScore += (score - shownScore) * Math.min(1, dt * 10);
  if (Math.abs(score - shownScore) < 0.5) shownScore = score;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.4);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.k === 0) { p.vy += 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 1.3 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (const b of E.blobs) {
    b.blink -= dt;
    if (b.blink <= 0) { b.blinkT = 0.13; b.blink = rand(2.2, 6); }
    if (b.blinkT > 0) b.blinkT -= dt;
  }
}

    ctx.fillStyle = cols[0]; ctx.beginPath(); ctx.arc(-0.03 * S, 0, 0.29 * S, 0, TAU); ctx.fill();
    ctx.fillStyle = cols[1]; ctx.beginPath();
    for (let p = 0; p < 10; p++) { const r = p % 2 ? 0.07 * S : 0.17 * S, a = p * Math.PI / 5; ctx.lineTo(0.32 * S + Math.cos(a) * r, Math.sin(a) * r); }
    ctx.fill();
    return;
  }
  if (type === 'su') {
    // red flag with gold star, hammer and sickle
    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, 2 * S);
    ctx.strokeStyle = cols[1]; ctx.fillStyle = cols[1]; ctx.lineCap = 'round';
    ctx.lineWidth = 0.04 * S; ctx.beginPath();
    for (let p = 0; p <= 10; p++) { const r = p % 2 ? 0.05 * S : 0.12 * S, a = -Math.PI / 2 + p * Math.PI / 5; ctx.lineTo(-0.3 * S + Math.cos(a) * r, -0.6 * S + Math.sin(a) * r); }

    ctx.beginPath(); ctx.moveTo(-0.5 * S, 0.12 * S); ctx.lineTo(-0.62 * S, 0.24 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.52 * S, 0.2 * S); ctx.lineTo(-0.12 * S, -0.3 * S); ctx.stroke();
    ctx.lineWidth = 0.1 * S; ctx.beginPath(); ctx.moveTo(-0.24 * S, -0.42 * S); ctx.lineTo(-0.02 * S, -0.2 * S); ctx.stroke();
    return;
  }
  if (type === 'gl') {

    ctx.fillStyle = cols[0]; ctx.fillRect(-S, -S, 2 * S, S);
    ctx.fillStyle = cols[1]; ctx.fillRect(-S, 0, 2 * S, S);

function blobPath(b) {
  const s = b.start, n = b.n;
  for (let k = 0; k < n; k++) {
    const i = s + k, ip = k + 1 < n ? i + 1 : s, im = k > 0 ? i - 1 : s + n - 1;
    const tx = X[ip] - X[im], ty = Y[ip] - Y[im], tl = Math.sqrt(tx * tx + ty * ty) || 1;
    OLX[k] = X[i] + ty / tl * RB; OLY[k] = Y[i] - tx / tl * RB;
  }
  const p = new Path2D();
  p.moveTo((OLX[n - 1] + OLX[0]) * 0.5, (OLY[n - 1] + OLY[0]) * 0.5);
  for (let k = 0; k < n; k++) {
    const k2 = k + 1 < n ? k + 1 : 0;
    p.quadraticCurveTo(OLX[k], OLY[k], (OLX[k] + OLX[k2]) * 0.5, (OLY[k] + OLY[k2]) * 0.5);
  }
  p.closePath();
  return p;
}

function drawBlob(b) {

function drawRoundBlob(level, cx, cy, R, sq, lw, face) {

function predict() {
  const R = RADII[cur], sp = 3 + aimPow * 29;
  let x = LX, y = LY, vx = Math.sin(aimAng) * sp, vy = Math.cos(aimAng) * sp;
  const pts = [], dt = 1 / 90;
  let hit = null;
  for (let k = 0; k < 160; k++) {
    vy += GRAV * dt; x += vx * dt; y += vy * dt;
    const fw = funnelAt(y);
    if (x < R - fw) { x = R - fw; vx = -vx * 0.35; } else if (x > WORLD_W - R + fw) { x = WORLD_W - R + fw; vx = -vx * 0.35; }
    if (y > FLOOR_Y - R) { hit = { x, y: FLOOR_Y - R }; break; }
    let hb = false;
    for (const b of E.blobs) {
      const dx = x - b.cx, dy = y - b.cy, rr = R + b.R * b.scale * 0.96;
      if (dx * dx + dy * dy < rr * rr) { hb = true; break; }
    }
    if (hb) { hit = { x, y }; break; }
    if (k % 3 === 0 && Math.hypot(x - LX, y - LY) > R + 0.4) pts.push(x, y);
  }
  return { pts, hit };
}

function drawAim() {
  const pr = predict(), n = pr.pts.length;
  ctx.fillStyle = '#fff7ee';
  for (let k = 0; k < n; k += 2) {
    const t = k / Math.max(1, n);
    ctx.globalAlpha = 0.6 - t * 0.4;
    ctx.beginPath(); ctx.arc(pr.pts[k], pr.pts[k + 1], 0.085 * (1 - t * 0.45), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (pr.hit) {
    ctx.setLineDash([0.18, 0.14]); ctx.lineWidth = 0.05; ctx.strokeStyle = 'rgba(255,247,238,0.6)';
    ctx.beginPath(); ctx.arc(pr.hit.x, pr.hit.y, RADII[cur], 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawLauncher() {
  const R = RADII[cur], p = Math.min(1, popT / 0.22), s = easeOutBack(p);
  if (s <= 0.02) return;
  const sq = 1 + Math.sin(time * 3.2) * 0.03;
  if (state === 'play') {
    const rr = R * s + 0.3;
    ctx.lineCap = 'round'; ctx.lineWidth = 0.09;
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath(); ctx.arc(LX, LY, rr, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(LX, LY, rr, -Math.PI / 2, -Math.PI / 2 + TAU * aimPow); ctx.stroke();
  }
  drawRoundBlob(cur, LX, LY, R * s, sq, 0.05, true);
}

// ---- trampolines on the walls all the way up from the buttons ----
const TR_TOP = -0.2, TR_BOT = BTN_Y - BTN_H / 2 - 0.3;
const tramp = [{ flash: 0, y: 0 }, { flash: 0, y: 0 }];
function bumperStep() {
  for (const t of tramp) if (t.flash > 0) t.flash -= STEP * 2.5;
  const hits = new Map(), lim = RB + 0.05;
  for (let i = 0; i < E.NB; i++) {
    const x = X[i];
    if (x > lim && x < WORLD_W - lim) continue;
    const y = Y[i];
    if (y < TR_TOP || y > TR_BOT) continue;
    if (!hits.has(OWN[i])) hits.set(OWN[i], [x < 1 ? 0 : 1, y]);
  }
  for (const [bi, [side, y]] of hits) {
    const b = E.blobs[bi];
    if (b.trampT && time - b.trampT < 0.35) continue;
    b.trampT = time;
    const dir = side ? -1 : 1, kick = 6 + Math.min(6, Math.abs(b.vx) * 0.6);
    for (let i = b.start; i < b.start + b.n; i++) { VX[i] = dir * Math.max(dir * VX[i], 0) + dir * kick; VY[i] -= 2; }
    tramp[side].flash = 1; tramp[side].y = y;
    sfx.bump();
    if (state === 'play') { addScore(10); floater('+10', side ? WORLD_W - 0.8 : 0.8, y, '#7fe7ff', 14); }
  }
}
function drawBumpers() {
  for (let side = 0; side < 2; side++) {
    const t = tramp[side], x = side ? WORLD_W - 0.2 : 0, f = Math.max(0, t.flash), h = TR_BOT - TR_TOP;
    // stretchy trampoline mat
    const g = ctx.createLinearGradient(x, 0, x + 0.2, 0);
    g.addColorStop(0, side ? '#1aa6d9' : '#7fe7ff'); g.addColorStop(1, side ? '#7fe7ff' : '#1aa6d9');
    ctx.fillStyle = g; rrect(x, TR_TOP, 0.2, h, 0.08); ctx.fill();
    // springs
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 0.035; ctx.beginPath();
    const zx = side ? WORLD_W - 0.1 : 0.1;
    for (let y = TR_TOP + 0.1, k = 0; y < TR_BOT - 0.05; y += 0.18, k++) ctx.lineTo(zx + (k % 2 ? 0.06 : -0.06), y);

    '<ul class="rules">' +
    `<li><i class="dot" style="background:${COLORS[0]}"></i><span><b>Tähtää</b> hiirellä tai sormella. Mitä kauemmas osoitat, sitä kovempaa pallo lentää.</span></li>` +
    `<li><i class="dot" style="background:${COLORS[2]}"></i><span><b>Ammu</b> klikkaamalla tai nostamalla sormen ruudulta.</span></li>` +
    `<li><i class="dot" style="background:${COLORS[4]}"></i><span>Kevyt laukaus laskee pallon varovasti, kova laukaus <b>tönii ja litistää</b> muita.</span></li>` +
    `<li><i class="dot" style="background:${COLORS[9]}"></i><span>Vaunun seinissä on kaksi nappia. Jos pallot koskettavat <b>molempia nappeja</b> yhtä aikaa, peli päättyy.</span></li>` +
    `<li><i class="dot" style="background:#ffcc00"></i><span>Joka <b>25 000 pisteellä</b> saat heilautuksen, joka ravistaa vaunua ja sekoittaa pallot.</span></li>` +
    `<li><i class="dot" style="background:#ff4d7d"></i><span>Ammu vaunun yläosassa lentäviä <b>tähtiä</b> ja <b>sydämiä</b>, niin saat bonuspisteitä.</span></li>` +
    '</ul>' +
    (validSave(store.get(AUTO_KEY, null))
      ? '<div class="row"><button class="btn" id="continueBtn" type="button">Jatka peliä</button><button class="btn alt" id="startBtn" type="button">Uusi peli</button></div>'
      : '<button class="btn" id="startBtn" type="button">Pelaa</button>') +
    slotsHTML('load') +
    musicRow() +
    '<div class="install" id="installRow"></div>' +
    '<p class="keys">Näppäimistö: ← → tähtää · ↑ ↓ voima · välilyönti ampuu · H heilauta · P tauko</p>');
  renderInstall();
}

// ------------------------------ install as an app (only in the app build) ------------------------------
const isAppBuild = !!document.querySelector('link[rel="manifest"]');
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let installPrompt = null;
function renderInstall() {
  const row = document.getElementById('installRow');
  if (!row) return;
  if (!isAppBuild || isStandalone()) row.innerHTML = '';
  else if (installPrompt) row.innerHTML = '<button class="btn alt" id="installBtn" type="button">Asenna sovellukseksi</button>';
  else if (isIOS) row.innerHTML = '<p class="hint">Asenna iPhoneen: napauta Safarin <b>Jaa</b>-painiketta ja valitse <b>Lisää Koti-valikkoon</b>.</p>';
  else row.innerHTML = '';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; renderInstall(); });
window.addEventListener('appinstalled', () => { installPrompt = null; renderInstall(); });
if (isAppBuild && 'serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ }); });
}

function showPause(note) {
  showOverlay('<h2 class="h2">Tauko</h2><p class="sub">Pisteet ' + score + '</p>' +
    (note ? `<p class="note">${note}</p>` : '') +
    '<div class="row"><button class="btn" id="resumeBtn" type="button">Jatka</button>' +
    '<button class="btn alt" id="saveBtn" type="button">Tallenna</button></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn alt" id="restartBtn" type="button">Aloita alusta</button>' +
    '<button class="btn alt" id="menuBtn" type="button">Päävalikko</button></div>' + musicRow());
}
function musicRow() {
  const opts = music.names.map((n, i) => `<option value="${i}"${music.track === i ? ' selected' : ''}>${n}</option>`).join('') + `<option value="-1"${music.track < 0 ? ' selected' : ''}>Ei musiikkia</option>`;
  return `<div class="audio"><label for="trackSel">♪ Musiikki</label><select id="trackSel">${opts}</select>` +
    `<label for="volRange">Äänenvoimakkuus</label><input id="volRange" type="range" min="0" max="100" value="${Math.round(sfx.volume * 100)}"></div>`;
}
function openAdmin() {
  adminOn = true;
  if (state === 'play') { state = 'paused'; aiming = false; syncUI(); }
  showAdmin();
}
function showAdmin(note) {
  const opts = NAMES.map((n, i) => `<option value="${i}"${i === cur ? ' selected' : ''}>${n}</option>`).join('');
  const inGame = state === 'paused' || state === 'play';
  showOverlay('<h2 class="h2">Admin</h2>' + (note ? `<p class="note">${note}</p>` : '') +
    (inGame
      ? `<div class="audio"><label for="adminBall">Seuraava pallo</label><select id="adminBall">${opts}</select></div>` +
        '<div class="row" style="margin-top:14px"><button class="btn alt" id="admCharge" type="button">+1 heilautus</button><button class="btn alt" id="admPts" type="button">+10 000 pistettä</button></div>' +
        '<div class="row" style="margin-top:12px"><button class="btn alt" id="admClear" type="button">Tyhjennä vaunu</button>' +
        `<button class="btn alt" id="admGod" type="button" aria-pressed="${invincible}">Kuolemattomuus: ${invincible ? 'päällä' : 'pois'}</button></div>` +
        '<div class="row" style="margin-top:12px"><button class="btn alt" id="admLose" type="button">Häviä peli</button></div>'
      : '<p class="sub">Aloita peli, niin voit muokata sitä täällä.</p>' +
        `<div class="row"><button class="btn alt" id="admGod" type="button" aria-pressed="${invincible}">Kuolemattomuus: ${invincible ? 'päällä' : 'pois'}</button></div>`) +
    '<div class="row" style="margin-top:16px"><button class="btn" id="admClose" type="button">Sulje</button></div>');
}
function closeAdmin() { if (state === 'paused') { state = 'play'; hideOverlay(); syncUI(); } else if (state === 'menu') showMenu(); else hideOverlay(); }
function showSaveSlots() {
  showOverlay('<h2 class="h2">Tallenna</h2>' + slotsHTML('save') +
    '<div class="row" style="margin-top:16px"><button class="btn alt" id="backBtn" type="button">Takaisin</button></div>');
}

function showOver(newBest) {
  showOverlay('<h2 class="h2">Purkki täyttyi!</h2>' +
    `<div class="final">${score}</div>` +
    (newBest && score > 0 ? '<p class="sub win">Uusi ennätys!</p>' : `<p class="sub">Ennätys ${best}</p>`) +
    `<div class="biggest"><span>Suurin maa</span><i class="dot" style="background:${COLORS[maxLevel]}"></i><b>${NAMES[maxLevel]} (${maxLevel + 1}/${MAXL + 1})</b></div>` +
    '<div class="row"><button class="btn" id="againBtn" type="button">Pelaa uudestaan</button><button class="btn alt" id="menuBtn" type="button">Päävalikko</button></div>');
}

card.addEventListener('change', e => {
  if (e.target.id === 'trackSel') { sfx.ensure(); music.setTrack(Number(e.target.value)); }
  if (e.target.id === 'adminBall') { cur = Number(e.target.value); popT = 0; }
});
card.addEventListener('input', e => { if (e.target.id === 'volRange') { sfx.ensure(); sfx.setVolume(Number(e.target.value) / 100); } });
card.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mascot')) {
    mascotTaps++; mascotTapT = 2; mascotBounce = 0.6;
    if (mascotTaps >= 5) { mascotTaps = 0; triggerNelli(); }
    return;
  }
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act, slot = btn.dataset.slot;
  if (act === 'save') { store.set(SLOT_KEY(slot), gameData()); showPause('Tallennettu paikkaan ' + slot + '.'); return; }
  if (act === 'load') { const g = store.get(SLOT_KEY(slot), null); if (validSave(g)) loadGame(g, false); return; }
  if (act === 'del') { store.set(SLOT_KEY(slot), null); showMenu(); return; }
  if (btn.id === 'startBtn' || btn.id === 'againBtn' || btn.id === 'restartBtn') startGame();
  else if (btn.id === 'continueBtn') { const g = store.get(AUTO_KEY, null); if (validSave(g)) loadGame(g, true); else startGame(); }
  else if (btn.id === 'resumeBtn') resume();
  else if (btn.id === 'saveBtn') showSaveSlots();
  else if (btn.id === 'admCharge') { charges++; syncAbil(); showAdmin('Heilautus lisätty.'); }
  else if (btn.id === 'admPts') { addScore(10000); shownScore = score; showAdmin('Lisätty 10 000 pistettä.'); }
  else if (btn.id === 'admClear') { clearAll(); dangerT = 0; jamT = 0; showAdmin('Vaunu tyhjennetty.'); }
  else if (btn.id === 'admGod') { invincible = !invincible; showAdmin('Kuolemattomuus ' + (invincible ? 'päällä.' : 'pois.')); }
  else if (btn.id === 'admClose') closeAdmin();
  else if (btn.id === 'admLose') { invincible = false; hideOverlay(); state = 'play'; gameOver(); }

  else if (btn.id === 'backBtn') showPause();
  else if (btn.id === 'menuBtn') toMenu();
  else if (btn.id === 'installBtn' && installPrompt) {
    const p = installPrompt;
    installPrompt = null;
    p.prompt();
    Promise.resolve(p.userChoice).catch(() => {}).then(renderInstall);
  }
});

// ------------------------------ input ------------------------------
function aimAt(e) {
  const wx = (e.clientX - OX) / SC, wy = (e.clientY - OY) / SC;
  const dx = wx - LX;
  let dy = wy - LY;
  if (dy < 0.3) dy = 0.3;
  aimAng = clamp(Math.atan2(dx, dy), -1.3, 1.3);
  aimPow = clamp((Math.hypot(wx - LX, wy - LY) - 0.9) / 10.5, 0.03, 1);
}
// four quick taps in the top-left corner open the admin panel
window.addEventListener('pointerdown', e => {
  if (e.clientX > 70 || e.clientY > 70) return;
  cornerTaps = performance.now() - cornerT < 1500 ? cornerTaps + 1 : 1; cornerT = performance.now();
  if (cornerTaps >= 4) { cornerTaps = 0; openAdmin(); }
}, true);
canvas.addEventListener('pointerdown', e => {
  if (e.clientX <= 70 && e.clientY <= 70) return;
  sfx.ensure();
  if (state !== 'play' || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  aiming = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  aimAt(e);
});
canvas.addEventListener('pointermove', e => { if (state === 'play' && (aiming || e.pointerType === 'mouse')) aimAt(e); });
canvas.addEventListener('pointerup', e => {
  if (state !== 'play' || !aiming) return;
  aiming = false; aimAt(e); shoot();
});
canvas.addEventListener('pointercancel', () => { aiming = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Space') e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (e.key && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-8);
    if (typed.endsWith('nelli')) { typed = ''; triggerNelli(); }
    else if (typed === 'admin123') { typed = ''; openAdmin(); }
  }
  if (state === 'play') {
    if (k === 'Space' || k === 'Enter') shoot();
    else if (k === 'KeyP' || k === 'Escape') pause();
    else if (k === 'KeyH') useAbility();
  } else if (state === 'paused') {
    if (k === 'KeyP' || k === 'Escape' || k === 'Space' || k === 'Enter') resume();
  } else if ((k === 'Space' || k === 'Enter') && !overlay.hidden) {
    const g = state === 'menu' ? store.get(AUTO_KEY, null) : null;
    if (validSave(g)) loadGame(g, true); else startGame();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play') pause(); else autoSave(); sfx.suspend(); } else sfx.resume(); });
window.addEventListener('pagehide', autoSave);
window.addEventListener('resize', layout);

function syncSound() {
  soundBtn.innerHTML = sfx.muted ? ICON_OFF : ICON_ON;
  soundBtn.setAttribute('aria-label', sfx.muted ? 'Laita äänet päälle' : 'Mykistä äänet');
}
soundBtn.addEventListener('click', () => { sfx.toggle(); syncSound(); soundBtn.blur(); });
abilBtn.addEventListener('click', () => { useAbility(); abilBtn.blur(); });
pauseBtn.addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'paused') resume(); pauseBtn.blur(); });

// ------------------------------ boot ------------------------------
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') {
  hot.snapshot(() => ({
    best, bestLevel,
    game: (state === 'play' || state === 'paused') ? gameData() : null
  }));
}

function start(data) {
  data = data || {};
  best = Math.max(best, Number(data.best) || 0);
  bestLevel = Math.max(bestLevel, Number(data.bestLevel) || 0);
  layout(); syncSound();
  try { if (document.fonts) { document.fonts.load(`800 20px ${FONT}`); document.fonts.load('400 40px "Lilita One"').then(() => buildBg()).catch(() => {}); } } catch (e) { /* ignore */ }
  const g = data.game;
  if (validSave(g) && g.blobs.length) {
    loadGame(g, false);
  } else {
    preloadMenu(); showMenu();
  }
  syncUI();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}

if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
